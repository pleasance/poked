<body>
<div id="wrap"><canvas id="c" width="300" height="224"></canvas></div>
<button id="snd" type="button" aria-label="Toggle sound">SND ON</button>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const BASE_H=224, Z0=70, DRAW=1400, STRIPE=26, FOG='#cdeeff';
let W=300,H=BASE_H,hor=80,yBase=H-22,laneW=38;

/* ---------------- sprite helpers ---------------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function addOutline(c,col){
  const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h).data;
  const solid=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>0;
  g.fillStyle=col;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)
    if(!solid(x,y)&&(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)))g.fillRect(x,y,1,1);
}
function fromRows(rows,pal,outline){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,pad=outline?1:0;
  const c=mk(w+pad*2,h+pad*2),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){g.fillStyle=col;g.fillRect(x+pad,y+pad,1,1);}}});
  if(outline)addOutline(c,outline);
  return c;
}
function blob(w,h,circles,pal3,outline){
  const pad=1,c=mk(w+pad*2,h+pad*2),g=c.getContext('2d');
  const inside=(x,y)=>circles.some(([cx,cy,r])=>{const dx=x+.5-cx,dy=y+.5-cy;return dx*dx+dy*dy<=r*r;});
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(!inside(x,y))continue;
    const v=(x/w+y/h)/2+(((x+y)&1)?.03:-.03);
    g.fillStyle=v<.36?pal3[0]:v>.62?pal3[2]:pal3[1];
    g.fillRect(x+pad,y+pad,1,1);
  }
  if(outline)addOutline(c,outline);
  return c;
}
const OUT='#2b1b2e';
const PAL={k:OUT,w:'#fffaf0',g:'#d3cadb',p:'#f4a3bd',H:'#7ddc6b',G:'#3fa34d',y:'#ffb347',o:'#f58a1f',O:'#cf5a12',
  h:'#c5c3d3',s:'#8f8ca3',S:'#5f5c75',r:'#e8394a',n:'#8a5a2b',N:'#5a3a1a',Y:'#ffe14d',M:'#5fb35a',
  a:'#58c05a',b:'#3a9b48',D:'#2b7a3a',t:'#8a5a2b'};

/* bunny (back view) */
const BUNNY_BODY=[
'....kk....kk....','...kwwk..kwwk...','...kwpk..kpwk...','...kwpk..kpwk...','...kwpk..kpwk...','...kwwk..kwwk...',
'....kwkkkkwk....','...kwwwwwwwwk...','..kwwwwwwwwwgk..','..kwwwwwwwwwgk..','.kwwwwwwwwwwwgk.','.kwwwwwggwwwwgk.',
'.kwwwwgwwgwwwgk.','.kwwwwgwwgwwwgk.','.kwwwwwggwwwwgk.','..kwwwwwwwwwgk..'];
const bunnyA=fromRows([...BUNNY_BODY,'..kwwwk..kwwwk..','.kkkkkkk.kkkk...'],PAL);
const bunnyB=fromRows([...BUNNY_BODY,'..kwwwk..kwwwk..','...kkkk.kkkkkkk.'],PAL);
const bunnyJ=fromRows([...BUNNY_BODY,'...kwwk..kwwk...','...kkkk..kkkk...'],PAL);

const CARROT=['..H.H...','..HGHG..','...GG...','.yooooO.','.yooooO.','.yoooOO.','..yoooO.','..yooOO.','...yooO.','...yoOO.','....oO..','....O...'];
const carrotSpr=fromRows(CARROT,PAL,OUT);
const goldPal=Object.assign({},PAL,{y:'#fff3a0',o:'#ffd23f',O:'#d99a00'});
const goldSpr=fromRows(CARROT,goldPal,OUT);
const rockSpr=fromRows(['...hhhhh....','..hhhhhssS..','.hhhhssssSS.','hhhhsssssSSS','hhhsssssssSS','hhssssssssSS','sssssssssSSS','.SSSSSSSSSS.'],PAL,OUT);
const mushSpr=fromRows(['..rrrr..','.rwrrwr.','rrrwwrrr','rrrrrrrr','..wwww..','..wwww..','..wwww..'],Object.assign({},PAL,{w:'#fff1d6'}),OUT);
const heartRows=['.rr.rr.','rwrrrrr','rrrrrrr','.rrrrr.','..rrr..','...r...'];
const heartFull=fromRows(heartRows,PAL,OUT);
const heartEmpty=fromRows(heartRows,Object.assign({},PAL,{r:'#4a3a5e',w:'#4a3a5e'}),OUT);
const carrotIcon=fromRows(CARROT,PAL,OUT);
const flowerSprs=['#ff6b9a','#7aa8ff','#ffffff'].map(c=>fromRows(['..r..','.rYr.','..r..','..G..','.GG..'],Object.assign({},PAL,{r:c}),OUT));
function pineRows(){
  const rows=[],Wd=16;
  for(const t of [[2,4,6,8],[6,8,10,12],[8,10,12,14]])for(const w of t){
    const l=(Wd-w)/2;let r='';
    for(let x=0;x<Wd;x++){
      if(x<l||x>=l+w)r+='.';
      else if(x>=l+w-2)r+='D';
      else r+=x<Wd/2?'a':'b';
    }
    rows.push(r);
  }
  for(let i=0;i<3;i++)rows.push('.......tt.......');
  return rows;
}
const pineSpr=fromRows(pineRows(),PAL,OUT);
function trunkOn(c,x,y0,w){const g=c.getContext('2d');g.fillStyle='#8a5a2b';g.fillRect(x,y0,w,c.height-1-y0);g.fillStyle='#5a3a1a';g.fillRect(x+w-1,y0,1,c.height-1-y0);}
const roundSpr=(()=>{
  const c=mk(21,28),g=c.getContext('2d');
  g.fillStyle='#8a5a2b';g.fillRect(9,17,3,10);g.fillStyle='#5a3a1a';g.fillRect(11,17,1,10);
  const b=blob(19,18,[[9.5,8.5,8.5],[5,11,5.5],[14,11,5.5]],['#79d86f','#47b44f','#2b8a3f'],OUT);
  g.drawImage(b,0,0);
  addOutline(c,OUT);
  return c;
})();
const bushSpr=blob(20,10,[[6,6,5],[11,5,5.5],[15,6.5,4.5]],['#6fd16a','#43ab4d','#2b8a3f'],OUT);
const cloudSpr=[blob(36,16,[[10,10,6],[18,8,8],[27,10,6],[16,11,6]],['#ffffff','#f1f7ff','#cfe0f7'],null),
                blob(26,12,[[8,8,5],[14,6,6],[20,8,4.5]],['#ffffff','#f1f7ff','#cfe0f7'],null)];
const logSpr=(()=>{
  const c=mk(40,10),g=c.getContext('2d');
  g.fillStyle='#a8703a';g.fillRect(0,0,40,10);
  g.fillStyle='#c48a4c';g.fillRect(0,0,40,3);
  g.fillStyle='#7a4a24';g.fillRect(0,7,40,3);
  g.fillStyle='#8a5a2b';for(let x=6;x<34;x+=7)g.fillRect(x,3,1,4);
  g.fillStyle='#e2b878';g.fillRect(0,0,4,10);g.fillRect(36,0,4,10);
  g.fillStyle='#b88a52';g.fillRect(1,2,2,6);g.fillRect(37,2,2,6);
  g.fillStyle=OUT;g.fillRect(0,0,40,1);g.fillRect(0,9,40,1);g.fillRect(0,0,1,10);g.fillRect(39,0,1,10);
  return c;
})();

/* ---------------- 3x5 pixel font ---------------- */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
'4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'!':'010010010000010','.':'000000000000010',':':'000010000010000','-':'000000111000000','+':'000010111010000','/':'001001010100100',
'<':'001010100010001','>':'100010001010100','?':'110001010000010'};
function textW(s,sc){return s.length*4*sc-sc;}
function drawText(s,x,y,sc,col,align,shadow){
  s=String(s).toUpperCase();
  const w=textW(s,sc);
  x=align==='center'?Math.round(x-w/2):align==='right'?Math.round(x-w):Math.round(x);
  y=Math.round(y);
  const pass=(ox,oy,c)=>{
    ctx.fillStyle=c;
    for(let i=0;i<s.length;i++){
      const gl=FONT[s[i]];if(!gl)continue;
      for(let k=0;k<15;k++)if(gl[k]==='1')ctx.fillRect(x+ox+(i*4+(k%3))*sc,y+oy+Math.floor(k/3)*sc,sc,sc);
    }
  };
  if(shadow!==null){const so=Math.max(1,Math.floor(sc/3));pass(so,so,shadow||OUT);}
  pass(0,0,col||'#fff');
}

/* ---------------- audio ---------------- */
let AC=null,master=null,muted=false,noiseBuf=null,musicOn=false,nextNote=0,mstep=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')try{AC.resume();}catch(e){}return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,slide,when){
  if(!AC||muted)return;
  const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,when,hp){
  if(!AC||muted)return;
  const t=AC.currentTime+(when||0),s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp||2000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);
}
const sfx={
  jump(){tone(300,.16,'square',.1,640);},
  move(){tone(520,.04,'square',.04);},
  carrot(n){const b=760+(n%8)*70;tone(b,.06,'square',.1);tone(b*1.5,.1,'square',.09,null,.05);},
  gold(){[880,1109,1319,1760].forEach((f,i)=>tone(f,.1,'square',.1,null,i*.06));},
  hit(){tone(180,.35,'sawtooth',.2,40);noise(.25,.25,0,600);},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,.28,'triangle',.22,null,i*.2));},
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,.09,'square',.09,null,i*.07));}
};
const mf=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[60,64,67],[57,60,64],[65,69,72],[67,71,74]];
function playStep(s,t){
  if(muted)return;
  const bar=Math.floor(s/8)%4,i=s%8,ch=CHORDS[bar];
  const off=t-AC.currentTime;
  const lead=[0,1,2,1,2,1,2,1][i];
  tone(mf(ch[lead]+(i%4===2?12:0)),.14,'square',.035,null,off);
  if(i%2===0)tone(mf(ch[0]-24+(i===4?7:0)),.2,'triangle',.11,null,off);
  if(i===0||i===4)tone(130,.12,'sine',.28,45,off);
  if(i===2||i===6)noise(.07,.07,off,3500);
  else if(i%2===1)noise(.03,.03,off,7000);
}
setInterval(()=>{
  if(!AC||!musicOn){return;}
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.18){playStep(mstep,nextNote);nextNote+=60/146/2;mstep=(mstep+1)%32;}
},50);

/* ---------------- game state ---------------- */
let state='title',paused=false,t=0,pos=0,speed=190,elapsed=0,startPos=0,bonus=0,carrots=0,chain=0,lives=3,best=0;
let lane=0,playerX=0,h=0,vy=0,jumpBuf=0,invuln=0,shake=0,shakeMag=0,flash=0,overT=0,runT=0,dustT=0,newBest=false,curveAmt=.6;
let items=[],decor=[],parts=[],pops=[],nextChunk=0,nextDecor=0,chunkN=0,bgX=0;
try{best=+localStorage.getItem('bunnyDashBest')||0;}catch(e){}
const JV=290,GRAV=900;
const score=()=>Math.floor((pos-startPos)/20)+bonus;

/* ---------------- level generation ---------------- */
const pickLane=()=>Math.floor(Math.random()*3)-1;
const ARC=[8,30,42,30,8];
function chLine(){const l=pickLane(),it=[];for(let i=0;i<6;i++)it.push({dz:i*32,lane:l,kind:'carrot'});return{len:190,it};}
function chZig(){let l=pickLane();const it=[];for(let i=0;i<9;i++){if(i%3===0&&i>0)l=clamp(l+(Math.random()<.5?-1:1),-1,1);it.push({dz:i*34,lane:l,kind:'carrot'});}return{len:310,it};}
function chGold(){const l=pickLane(),it=[];for(let i=0;i<4;i++)it.push({dz:i*32,lane:l,kind:'carrot'});it.push({dz:4*32+10,lane:l,kind:'gold'});return{len:190,it};}
function chGap(){const f=pickLane(),it=[];for(let l=-1;l<=1;l++)if(l!==f)it.push({dz:110,lane:l,kind:'rock'});for(let i=0;i<7;i++)it.push({dz:i*30,lane:f,kind:'carrot'});return{len:200,it};}
function arcAt(it,z0,l){for(let i=0;i<5;i++)it.push({dz:z0+(i-2)*40,lane:l,kind:'carrot',h:ARC[i]});}
function chLog(){const it=[{dz:110,lane:0,kind:'log'}];arcAt(it,110,pickLane());return{len:230,it};}
function chDouble(){const sp=200+.5*Math.min(520,speed+120),it=[{dz:110,lane:0,kind:'log'},{dz:110+sp,lane:0,kind:'log'}];arcAt(it,110,pickLane());arcAt(it,110+sp,pickLane());return{len:sp+120,it};}
function chSlalom(){
  const sp=150+speed*.25,n=4,ls=[],it=[];
  for(let i=0;i<n;i++){ls.push(pickLane());it.push({dz:i*sp,lane:ls[i],kind:'rock'});}
  for(let i=0;i<n-1;i++){
    const opts=[-1,0,1].filter(l=>l!==ls[i]&&l!==ls[i+1]),f=opts[Math.floor(Math.random()*opts.length)];
    const mid=i*sp+sp/2;
    for(let k=-1;k<=1;k++)it.push({dz:mid+k*22,lane:f,kind:'carrot'});
  }
  return{len:(n-1)*sp+40,it};
}
function pickChunk(){
  const n=chunkN++;
  if(n<2)return chLine();
  if(n<4)return Math.random()<.5?chLine():chZig();
  const hard=Math.min(1,elapsed/40);
  const tbl=[[chLine,18],[chZig,14],[chGold,8],[chGap,14+14*hard],[chLog,14+6*hard],[chSlalom,5+14*hard],[chDouble,3+9*hard]];
  let tot=0;tbl.forEach(e=>tot+=e[1]);let r=Math.random()*tot;
  for(const e of tbl){r-=e[1];if(r<=0)return e[0]();}
  return chLine();
}
function spawnChunk(){
  const c=pickChunk();
  for(const o of c.it)items.push({d:nextChunk+o.dz,lane:o.lane,kind:o.kind,h:o.h||0,taken:false,hit:false,ph:Math.random()*6});
  nextChunk+=c.len+80+Math.min(520,speed+120)*.5;
}
function addDecor(d,side){
  const r=Math.random();let type,lat,v=0;
  if(r<.36){type='pine';lat=2.1+Math.random()*1.9;}
  else if(r<.56){type='round';lat=2.1+Math.random()*1.9;}
  else if(r<.70){type='bush';lat=1.95+Math.random()*.9;}
  else if(r<.90){type='flower';lat=1.9+Math.random()*1.2;v=Math.floor(Math.random()*3);}
  else{type='mush';lat=1.95+Math.random()*.9;}
  decor.push({d,lat:lat*side,type,v});
}
function spawnWorld(){
  while(nextDecor<pos+DRAW+120){
    if(Math.random()<.85)addDecor(nextDecor,-1);
    if(Math.random()<.85)addDecor(nextDecor+rnd(0,30),1);
    nextDecor+=rnd(38,75);
  }
  if(state==='play')while(nextChunk<pos+DRAW+120)spawnChunk();
}

/* ---------------- background prerender ---------------- */
let sky,farMt,nearHill,clouds=[],colG=[],colR=[],colB=[],rowP=[],rowZ=[],cx=new Float32Array(BASE_H+2);
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
function mix(a,b,f){const A=hex(a),B=hex(b);return`rgb(${Math.round(A[0]+(B[0]-A[0])*f)},${Math.round(A[1]+(B[1]-A[1])*f)},${Math.round(A[2]+(B[2]-A[2])*f)})`;}
function mount(w,hMax,ks,lo,hi,base,shade,hi2,cap,capAt){
  const c=mk(w,hMax),g=c.getContext('2d'),hs=[];
  const ph=ks.map(()=>Math.random()*6.28);
  for(let i=0;i<w;i++){
    const a=i/w*Math.PI*2;let s=0,tw=0;
    ks.forEach((k,j)=>{const wt=1/(j+1.3);s+=Math.sin(k*a+ph[j])*wt;tw+=wt;});
    const n=(s/tw+1)/2;hs.push(Math.round(lo+(hi-lo)*Math.pow(n,1.4)));
  }
  for(let i=0;i<w;i++){
    const hh=hs[i],top=hMax-hh,sl=hs[(i+1)%w]-hh;
    g.fillStyle=sl<0?shade:base;g.fillRect(i,top,1,hh);
    g.fillStyle=hi2;g.fillRect(i,top,1,1);
    if(cap&&hh>capAt){g.fillStyle=cap;g.fillRect(i,top,1,Math.min(6,1+Math.floor((hh-capAt)/3)));
      if(sl<0){g.fillStyle='#dfe7ff';g.fillRect(i,top+1,1,Math.min(5,Math.floor((hh-capAt)/3)));}}
  }
  return c;
}
function disc(g,x,y,r,col){g.fillStyle=col;for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++)if(xx*xx+yy*yy<=r*r)g.fillRect(Math.round(x+xx),Math.round(y+yy),1,1);}
function build(){
  const rows=hor+1;
  sky=mk(W,rows);const g=sky.getContext('2d');
  const bands=['#2f6fd6','#3f84e2','#559bec','#6fb2f3','#8cc6f8','#aedbfb',FOG];
  const bh=Math.ceil(rows/bands.length);
  bands.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*bh,W,bh);
    if(i>0){g.fillStyle=bands[i-1];for(let y=0;y<3;y++)for(let x=0;x<W;x++)if(((x+y)&1)===(y===1?1:0)&&y<2)g.fillRect(x,i*bh+y,1,1);}});
  disc(g,W*.74,hor*.36,16,'#fff9c8');disc(g,W*.74,hor*.36,12,'#fff3a0');disc(g,W*.74,hor*.36,9,'#ffe970');
  farMt=mount(512,64,[3,7,13],14,62,'#9aa6e0','#7f8ccf','#b9c3f2','#ffffff',42);
  nearHill=mount(512,26,[5,11,17],5,24,'#52a85f','#419650','#78c982',null,0);
  clouds=[];for(let i=0;i<6;i++)clouds.push({x:rnd(0,W+80),y:rnd(6,hor*.55),s:cloudSpr[i%2],v:rnd(2,7)});
  colG=[];colR=[];colB=[];rowP=[];rowZ=[];
  const GR=['#3fa34d','#379444'],RD=['#dcb67e','#d0a66e'],BD=['#f5ead0','#c4a77a'];
  for(let y=hor+1;y<H;y++){
    const p=(y-hor)/(yBase-hor),f=clamp((.22-p)/.22,0,1)*.78;
    rowP[y]=p;rowZ[y]=Z0/p-Z0;
    colG[y]=GR.map(c=>mix(c,FOG,f));colR[y]=RD.map(c=>mix(c,FOG,f));colB[y]=BD.map(c=>mix(c,FOG,f));
  }
}
function resize(){
  const aw=Math.max(200,innerWidth-8),ah=Math.max(200,innerHeight-8);
  const asp=clamp(aw/ah,.75,1.8);
  H=BASE_H;W=Math.round(H*asp);cv.width=W;cv.height=H;
  const s=Math.min(aw/W,ah/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  hor=Math.round(H*.36);yBase=H-22;laneW=clamp(Math.round(W*.2),30,40);
  cx=new Float32Array(H+2);
  build();
}

/* ---------------- control ---------------- */
function resetRun(){
  items=[];parts=[];pops=[];lane=0;playerX=0;h=0;vy=0;jumpBuf=0;invuln=0;lives=3;carrots=0;chain=0;bonus=0;elapsed=0;
  startPos=pos;nextChunk=pos+480;chunkN=0;newBest=false;speed=Math.max(speed,200);
}
function startGame(){
  audioInit();resetRun();state='play';paused=false;musicOn=true;mstep=0;sfx.start();
}
function tryStart(){if(state==='title'||(state==='over'&&overT>.7))startGame();}
function moveLane(d){if(state!=='play'||paused)return;const n=clamp(lane+d,-1,1);if(n!==lane){lane=n;sfx.move();}}
function doJump(){vy=JV;h=.01;sfx.jump();}
function jump(){if(state!=='play'||paused)return;if(h<=0&&vy<=0)doJump();else jumpBuf=.14;}
function hurt(){
  lives--;chain=0;invuln=1.7;shake=.3;shakeMag=7;flash=.18;speed*=.55;sfx.hit();rumble(260,1);
  for(let i=0;i<10;i++)parts.push({x:W/2+playerOff(),y:yBase-14,vx:rnd(-70,70),vy:rnd(-110,-20),life:.5,c:i%2?'#fff':'#ffd23f',s:2,g:260});
  if(lives<=0){
    state='over';overT=0;musicOn=false;sfx.over();
    const sc=score();if(sc>best){best=sc;newBest=true;try{localStorage.setItem('bunnyDashBest',String(best));}catch(e){}}
  }
}
function playerOff(){return 0;}

addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(k))e.preventDefault();
  if(e.repeat)return;
  audioInit();
  if(k==='p'||k==='P'||k==='Escape'){if(state==='play')paused=!paused;return;}
  if(k==='m'||k==='M'){toggleMute();return;}
  if(state!=='play'){if(k===' '||k==='Enter'||k.startsWith('Arrow'))tryStart();return;}
  if(paused){paused=false;return;}
  if(k==='ArrowLeft'||k==='a'||k==='A')moveLane(-1);
  else if(k==='ArrowRight'||k==='d'||k==='D')moveLane(1);
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' '||k==='Spacebar')jump();
});
let ptr=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptr={x:e.clientX,y:e.clientY,swiped:false,id:e.pointerId};
  if(state!=='play'){tryStart();ptr.swiped=true;}
  else if(paused){paused=false;ptr.swiped=true;}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id||state!=='play'||paused)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,th=Math.max(18,cv.clientWidth*.06);
  if(Math.abs(dx)>th&&Math.abs(dx)>=Math.abs(dy)){moveLane(dx>0?1:-1);ptr.x=e.clientX;ptr.y=e.clientY;ptr.swiped=true;}
  else if(dy<-th&&Math.abs(dy)>Math.abs(dx)){jump();ptr.x=e.clientX;ptr.y=e.clientY;ptr.swiped=true;}
});
cv.addEventListener('pointerup',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  if(!ptr.swiped&&state==='play'&&!paused){
    const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
    if(fx<.34)moveLane(-1);else if(fx>.66)moveLane(1);else jump();
  }
  ptr=null;
});
cv.addEventListener('pointercancel',()=>{ptr=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const sndBtn=document.getElementById('snd');
function toggleMute(){muted=!muted;sndBtn.textContent=muted?'SND OFF':'SND ON';sndBtn.style.opacity=muted?.5:.85;}
sndBtn.addEventListener('click',e=>{e.stopPropagation();audioInit();toggleMute();});
sndBtn.addEventListener('pointerdown',e=>e.stopPropagation());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true;});
addEventListener('resize',resize);

/* ---------------- update ---------------- */
function curveAt(d){return Math.tanh(1.1*(Math.sin(d/1300)+.55*Math.sin(d/520+1.7)))*curveAmt;}
function popup(x,y,text,col){pops.push({x,y,text,col:col||'#fff',life:.8});}
function burst(x,y,cols,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-60,60),vy:rnd(-90,-10),life:rnd(.3,.55),c:cols[i%cols.length],s:i%3?1:2,g:220});}
function bunnyX(){return cx[yBase]+playerX*laneW;}
function update(dt){
  t+=dt;
  if(state==='play'){
    elapsed+=dt;
    const target=Math.min(520,250+elapsed*5);
    speed+=(target-speed)*Math.min(1,dt*(speed<target*.9?1.2:2.5));
    curveAmt=Math.min(1,.35+elapsed/35);
  }else if(state==='title'){speed=190;curveAmt=.7;}
  else{speed*=Math.max(0,1-dt*3);}
  pos+=speed*dt;
  bgX-=curveAt(pos)*speed*dt*.05;
  spawnWorld();
  items=items.filter(i=>i.d>pos-60);decor=decor.filter(d=>d.d>pos-60);

  if(state==='title')playerX=Math.sin(t*1.1)*.75;
  else playerX+=(lane-playerX)*Math.min(1,dt*15);

  if(h>0||vy>0){
    vy-=GRAV*dt;h+=vy*dt;
    if(h<=0){h=0;vy=0;burst(bunnyX(),yBase,['#e6d3a8','#fff3d0'],5);if(jumpBuf>0){doJump();jumpBuf=0;}}
  }
  jumpBuf=Math.max(0,jumpBuf-dt);
  if(state!=='over'){runT+=dt*(speed/230);}
  dustT-=dt;
  if(h<=0&&speed>60&&dustT<=0&&state!=='over'){dustT=.06;parts.push({x:bunnyX()+rnd(-6,6),y:yBase-1,vx:rnd(-12,12),vy:rnd(10,40),life:.3,c:'#ead9b0',s:2,g:0});}
  invuln=Math.max(0,invuln-dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
  if(state==='over')overT+=dt;

  if(state==='play'&&!paused){
    for(const it of items){
      if(it.taken||it.hit)continue;
      const z=it.d-pos;
      if(z>16||z<-16)continue;
      const dl=Math.abs(playerX-it.lane);
      if(it.kind==='carrot'||it.kind==='gold'){
        if(dl<.75&&Math.abs(h-it.h)<20){
          it.taken=true;chain++;
          const mult=Math.min(5,1+Math.floor(chain/8));
          const gold=it.kind==='gold';
          const pts=(gold?50:10)*mult;bonus+=pts;carrots+=gold?5:1;
          const p=Z0/(z+Z0),yy=hor+p*(yBase-hor)-(it.h+10)*p;
          burst(bunnyX(),yBase-14-h,gold?['#ffd23f','#fff3a0','#fff']:['#f58a1f','#ffb347','#fff'],gold?10:6);
          popup(bunnyX(),yBase-34-h,'+'+pts,gold?'#ffe14d':'#fff');
          if(gold)sfx.gold();else sfx.carrot(chain);
          if(chain>0&&chain%8===0){popup(bunnyX(),yBase-48-h,'X'+mult+'!','#ff8a3d');}
        }
      }else if(invuln<=0){
        const lim=it.kind==='log'?14:12;
        if((it.kind==='log'||dl<.58)&&h<lim){it.hit=true;hurt();}
      }
    }
  }
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=26*dt;}
  pops=pops.filter(p=>p.life>0);
}

/* ---------------- draw ---------------- */
function q(s){return s<.5?Math.max(.125,Math.round(s*8)/8):s<1?Math.round(s*4)/4:Math.round(s*2)/2;}
function proj(z,lat){
  const p=Z0/(z+Z0),y=hor+p*(yBase-hor),yi=clamp(Math.round(y),hor+1,H-1);
  return{p,y,x:cx[yi]+lat*laneW*p};
}
function blit(img,x,y,sc,a){
  const w=Math.max(1,Math.round(img.width*sc)),hh=Math.max(1,Math.round(img.height*sc));
  if(a<1)ctx.globalAlpha=a;
  ctx.drawImage(img,Math.round(x-w/2),Math.round(y-hh),w,hh);
  if(a<1)ctx.globalAlpha=1;
}
function shadow(x,y,w){ctx.fillStyle='rgba(30,40,20,.32)';w=Math.max(2,Math.round(w));ctx.fillRect(Math.round(x-w/2),Math.round(y)-1,w,2);ctx.fillRect(Math.round(x-w/2)+1,Math.round(y)-2,Math.max(1,w-2),1);}
function drawBunny(){
  const x=bunnyX(),y=yBase;
  const hh=Math.max(0,h);
  shadow(x,y,Math.max(10,30-hh*.35));
  if(invuln>0&&state==='play'&&Math.floor(invuln*14)%2===0)return;
  const grounded=hh<=0;
  const fr=!grounded||state==='over'?bunnyJ:(Math.floor(runT*5.5)%2?bunnyA:bunnyB);
  const bob=grounded&&state!=='over'?(Math.floor(runT*5.5)%2?0:1):0;
  const sc=2,w=fr.width*sc,hg=fr.height*sc;
  ctx.drawImage(fr,Math.round(x-w/2),Math.round(y-hg-hh+bob),w,hg);
  if(state==='over'){for(let i=0;i<3;i++){const a=t*4+i*2.1;ctx.fillStyle='#ffe14d';ctx.fillRect(Math.round(x+Math.cos(a)*12),Math.round(y-hg-6+Math.sin(a)*3),2,2);}}
}
function render(){
  /* road geometry */
  let off=0,dx=0;
  for(let y=H-1;y>hor;y--){
    dx+=curveAt(pos+Math.min(rowZ[y],2600))*.006;off+=dx;
    const p=rowP[y];
    cx[y]=W/2+off-playerX*.55*laneW*p;
  }
  ctx.save();
  if(shake>0)ctx.translate(Math.round((Math.random()-.5)*shakeMag*(shake/.3)),Math.round((Math.random()-.5)*shakeMag*(shake/.3)));
  ctx.fillStyle=FOG;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.drawImage(sky,0,0);
  for(const c of clouds){
    const x=((c.x-bgX*.1+t*c.v)%(W+90)+W+90)%(W+90)-45;
    ctx.drawImage(c.s,Math.round(x),Math.round(c.y));
  }
  const drawTile=(img,par,y)=>{const w=img.width,o=((bgX*par)%w+w)%w;ctx.drawImage(img,-Math.round(o),y);ctx.drawImage(img,w-Math.round(o),y);};
  drawTile(farMt,.35,hor+1-farMt.height);
  drawTile(nearHill,.7,hor+1-nearHill.height);
  /* ground */
  for(let y=hor+1;y<H;y++){
    const p=rowP[y],s=Math.floor((pos+rowZ[y])/STRIPE)&1,c=Math.round(cx[y]);
    const rw=Math.max(1,Math.round(1.5*laneW*p)),bw=Math.max(1,Math.round(.26*laneW*p));
    ctx.fillStyle=colG[y][s];ctx.fillRect(0,y,W,1);
    ctx.fillStyle=colB[y][s];ctx.fillRect(c-rw-bw,y,2*(rw+bw),1);
    ctx.fillStyle=colR[y][s];ctx.fillRect(c-rw,y,2*rw,1);
    if(s===0){
      const lw=Math.max(1,Math.round(p*1.6)),lo=Math.round(.5*laneW*p);
      ctx.fillStyle='#f7edd2';ctx.fillRect(c-lo-(lw>>1),y,lw,1);ctx.fillRect(c+lo-(lw>>1),y,lw,1);
    }
  }
  /* sprites */
  const list=[];
  for(const it of items){if(it.taken)continue;const z=it.d-pos;if(z<-14||z>DRAW)continue;list.push({z,o:it,t:0});}
  for(const d of decor){const z=d.d-pos;if(z<-14||z>DRAW)continue;list.push({z,o:d,t:1});}
  list.push({z:0,t:2});
  list.sort((a,b)=>b.z-a.z);
  for(const e of list){
    if(e.t===2){drawBunny();continue;}
    const o=e.o,a=e.z>DRAW-350?clamp((DRAW-e.z)/350,0,1):1;
    if(a<=0)continue;
    if(e.t===0){
      const pr=proj(e.z,o.lane),p=pr.p;
      if(o.kind==='log'){
        const span=3*laneW+16,dw=Math.max(2,Math.round(span*p)),dh=Math.max(2,Math.round(20*p));
        shadow(pr.x,pr.y,dw*.9);
        ctx.globalAlpha=a;ctx.drawImage(logSpr,Math.round(pr.x-dw/2),Math.round(pr.y-dh),dw,dh);ctx.globalAlpha=1;
      }else if(o.kind==='rock'){
        shadow(pr.x,pr.y,24*p);blit(rockSpr,pr.x,pr.y,q(p*2.2),a);
      }else{
        const gold=o.kind==='gold',bob=Math.sin(t*5+o.ph)*2,air=(o.h+7+bob)*p;
        shadow(pr.x,pr.y,(gold?14:11)*p*(1-Math.min(.5,o.h/90)));
        blit(gold?goldSpr:carrotSpr,pr.x,pr.y-air,q(p*(gold?2.5:2)),a);
        if(gold&&Math.floor(t*8+o.ph)%3===0&&p>.2){ctx.fillStyle='#fff';const sx=Math.round(pr.x+Math.sin(t*3+o.ph)*8*p),sy=Math.round(pr.y-air-18*p);ctx.fillRect(sx,sy-1,1,3);ctx.fillRect(sx-1,sy,3,1);}
      }
    }else{
      const pr=proj(e.z,o.lat),p=pr.p;
      if(o.type==='pine')blit(pineSpr,pr.x,pr.y,q(p*2.6),a);
      else if(o.type==='round')blit(roundSpr,pr.x,pr.y,q(p*2.5),a);
      else if(o.type==='bush')blit(bushSpr,pr.x,pr.y,q(p*2),a);
      else if(o.type==='flower')blit(flowerSprs[o.v],pr.x,pr.y,q(p*2),a);
      else blit(mushSpr,pr.x,pr.y,q(p*2),a);
    }
  }
  /* particles */
  for(const p of parts){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}
  for(const p of pops)drawText(p.text,p.x,p.y,1,p.col,'center');
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash/.18*.35)+')';ctx.fillRect(0,0,W,H);}
  drawHud();
}
function drawHud(){
  if(state!=='title'){
    for(let i=0;i<3;i++)ctx.drawImage(i<lives?heartFull:heartEmpty,4+i*(heartFull.width+1),4);
    ctx.drawImage(carrotIcon,4,19);
    drawText('X'+carrots,17,23,2,'#ffd9a0');
    const mult=Math.min(5,1+Math.floor(chain/8));
    if(mult>1)drawText('COMBO X'+mult,4,38,1,'#ff9a4d');
    drawText(String(score()).padStart(6,'0'),W-4,5,2,'#fff','right');
    drawText('BEST '+best,W-4,19,1,'#ffe9a8','right');
  }
  const cxm=W/2;
  if(state==='title'){
    ctx.fillStyle='rgba(30,15,60,.28)';ctx.fillRect(0,0,W,H);
    const b=Math.round(Math.sin(t*3)*2);
    drawText('BUNNY',cxm,24+b,6,'#fffaf0','center','#e8604a');
    drawText('DASH',cxm,66-b,6,'#ffb347','center','#b04a12');
    drawText('COLLECT CARROTS!',cxm,118,2,'#fff','center');
    if(Math.floor(t*2)%2===0)drawText(padOn?'PRESS ANY BUTTON':'TAP OR PRESS SPACE',cxm,H-62,2,'#ffe14d','center');
    drawText(padOn?'STICK OR D-PAD: MOVE':'SWIPE OR < > : MOVE',cxm,H-40,1,'#fff','center');
    drawText(padOn?'A: HOP  START: PAUSE':'TAP OR UP/SPACE: HOP',cxm,H-30,1,'#fff','center');
    drawText('BEST '+best,cxm,H-14,1,'#ffe9a8','center');
  }else if(state==='over'){
    ctx.fillStyle='rgba(30,15,60,.55)';ctx.fillRect(0,0,W,H);
    drawText('GAME OVER',cxm,48,4,'#ff6b6b','center');
    drawText('SCORE '+score(),cxm,92,2,'#fff','center');
    drawText('CARROTS '+carrots,cxm,112,2,'#ffb347','center');
    drawText(newBest?'NEW BEST!':'BEST '+best,cxm,134,2,newBest&&Math.floor(t*6)%2?'#ffe14d':'#ffe9a8','center');
    if(overT>.7&&Math.floor(t*2)%2===0)drawText('TAP TO RETRY',cxm,H-60,2,'#fff','center');
  }else if(paused){
    ctx.fillStyle='rgba(30,15,60,.55)';ctx.fillRect(0,0,W,H);
    drawText('PAUSED',cxm,H/2-16,4,'#fff','center');
    drawText(padOn?'PRESS START':'TAP OR PRESS P',cxm,H/2+22,1,'#ffe9a8','center');
  }
}

/* ---------------- gamepad ---------------- */
let padOn=false,padRef=null,padPrev={btn:[],left:false,right:false,up:false};
function pollPad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=null;
  for(const g of gps){if(g&&g.connected){gp=g;break;}}
  if(!gp){padOn=false;padRef=null;return;}
  padOn=true;padRef=gp;
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  const pressed=i=>b(i)&&!padPrev.btn[i];
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const left=ax<-.5||b(14),right=ax>.5||b(15),up=ay<-.6||b(12);
  const act=[0,1,2,3,4,5,6,7].some(pressed);
  const start=pressed(9)||pressed(8);
  const lEdge=left&&!padPrev.left,rEdge=right&&!padPrev.right,uEdge=up&&!padPrev.up;
  if(act||start||lEdge||rEdge||uEdge)audioInit();
  if(state!=='play'){
    if(act||start||lEdge||rEdge||uEdge)tryStart();
  }else if(paused){
    if(act||start)paused=false;
  }else{
    if(start)paused=true;
    else{
      if(lEdge)moveLane(-1);
      if(rEdge)moveLane(1);
      if(act||uEdge)jump();
    }
  }
  padPrev={btn:gp.buttons.map(x=>!!(x&&x.pressed)),left,right,up};
}
function rumble(ms,strong){
  try{
    const a=padRef&&(padRef.vibrationActuator);
    if(a&&a.playEffect)a.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:strong*.6});
  }catch(e){}
}

/* ---------------- main loop ---------------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;
  pollPad();
  if(!(dt>0))dt=.016;
  dt=Math.min(dt,.033);
  if(!paused)update(dt);
  render();
}
resize();
pos=0;nextDecor=60;
spawnWorld();
requestAnimationFrame(ts=>{last=ts;frame(ts);});
window.__game={get state(){return state;},start:startGame,jump,moveLane,get lives(){return lives;},get score(){return score();},set god(v){if(v)lives=99;}};
})();
</script>
