<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Burrow Bots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one centred column. Header, stat strip, square-ish maze stage with overlay, backpack row, touch pad. */
:root{
  --bg:#12131f; --panel:#1a1c2c; --line:#333c57; --fg:#f4f4f4; --muted:#94b0c2;
  --accent:#ffcd75; --hot:#ef7d57; --bad:#b13e53; --good:#a7f070; --cool:#41a6f6;
  --font-display:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  --font-body:"VT323",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:20px; line-height:1.2;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:16px;font-weight:400;margin:0;color:var(--accent);letter-spacing:1px;text-shadow:3px 3px 0 var(--bad)}
.tools{display:flex;gap:8px}
.tbtn{font-family:var(--font-display);font-size:9px;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:8px 10px;cursor:pointer;letter-spacing:1px}
.tbtn:hover{border-color:var(--accent)}
button:focus-visible{outline:3px dashed var(--fg);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1 1 84px;min-width:0;background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.stat.life{flex:2 1 150px}
.lbl{font-family:var(--font-display);font-size:8px;color:var(--muted);letter-spacing:1px}
.val{font-family:var(--font-display);font-size:13px;color:var(--fg);min-height:24px;display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;image-rendering:pixelated}
.ic.off{filter:grayscale(1) brightness(.5);opacity:.6}
.stage{position:relative;width:min(100%,608px,calc((100svh - 250px)*0.9048));min-width:240px;margin-inline:auto;border:4px solid var(--line);background:#1a1c2c;touch-action:none}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,19,31,.9);padding:12px;text-align:center;overflow:auto}
.panel{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:420px;width:100%;margin:auto}
.panel h2{font-family:var(--font-display);font-size:15px;font-weight:400;margin:0;color:var(--accent);line-height:1.4;text-wrap:balance;text-shadow:3px 3px 0 var(--bad)}
.panel p{margin:0;font-size:21px;color:var(--fg);text-wrap:balance}
.panel .sub{color:var(--muted);font-size:19px}
.btn{font-family:var(--font-display);font-size:11px;color:#1a1c2c;background:var(--accent);border:0;padding:13px 18px;cursor:pointer;box-shadow:0 4px 0 var(--bad);letter-spacing:1px}
.btn:hover{background:#fff1b8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bad)}
.cards{display:flex;flex-direction:column;gap:8px;width:100%}
.card{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--panel);color:var(--fg);border:3px solid var(--line);padding:8px 10px;cursor:pointer;font-family:var(--font-body);font-size:20px}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.card img{width:40px;height:40px;image-rendering:pixelated}
.card b{display:block;font-family:var(--font-display);font-size:9px;font-weight:400;color:var(--accent);margin-bottom:5px;line-height:1.4}
.card .d{display:block;line-height:1.05}
.card .own{color:var(--muted)}
.stats3{display:flex;gap:16px;font-family:var(--font-display);font-size:10px;flex-wrap:wrap;justify-content:center;line-height:1.6}
.stats3 span{color:var(--muted)}
.pack{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);padding:8px 10px;min-height:44px}
.pack .t{font-family:var(--font-display);font-size:8px;color:var(--muted);letter-spacing:1px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-size:10px;background:var(--bg);border:2px solid var(--line);padding:2px 6px 2px 2px}
.empty{color:var(--muted)}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center}
.pad button{font-family:var(--font-display);font-size:16px;color:var(--fg);background:var(--panel);border:2px solid var(--line);cursor:pointer;touch-action:none}
.pad button:active{background:var(--line);border-color:var(--accent)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (hover:none),(pointer:coarse){.pad{display:grid}.keys{display:none}}
.keys{text-align:center;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

<main class="app">
  <header class="top">
    <h1>Burrow Bots</h1>
    <div class="tools">
      <button class="tbtn" id="pauseBtn" type="button">PAUSE</button>
      <button class="tbtn" id="muteBtn" type="button">SOUND ON</button>
    </div>
  </header>
  <section class="hud" aria-label="Status">
    <div class="stat"><span class="lbl">LEVEL</span><span class="val" id="lvl">1</span></div>
    <div class="stat"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lbl">BEST</span><span class="val" id="best">0</span></div>
    <div class="stat life"><span class="lbl">HEARTS</span><span class="val" id="hearts"></span></div>
  </section>
  <div class="stage" id="stage">
    <canvas id="game" aria-label="Bunny maze game"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="pack" id="owned" aria-label="Upgrades you own"></div>
  <div class="pad" id="pad">
    <button class="u" id="padU" type="button" data-dx="0" data-dy="-1" aria-label="Up">UP</button>
    <button class="l" id="padL" type="button" data-dx="-1" data-dy="0" aria-label="Left">LT</button>
    <button class="dn" id="padD" type="button" data-dx="0" data-dy="1" aria-label="Down">DN</button>
    <button class="r" id="padR" type="button" data-dx="1" data-dy="0" aria-label="Right">RT</button>
  </div>
  <p class="keys">Arrow keys or WASD to hop. P pauses. 1, 2 and 3 pick upgrades.</p>
</main>
<script>
(function(){
'use strict';
var TS=16,COLS=19,ROWS=21,W=COLS*TS,H=ROWS*TS;
var $=function(id){return document.getElementById(id)};
var cv=$('game'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
var rnd=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- pixel sprites ---------- */
var PAL={k:'#0d0e1a',w:'#f4f4f4',g:'#94b0c2',G:'#566c86',D:'#333c57',p:'#f7a8b8',r:'#b13e53',o:'#ef7d57',y:'#ffcd75',l:'#a7f070',n:'#38b764',b:'#41a6f6',c:'#73eff7',u:'#3b5dc9',t:'#257179'};
function sprite(rows,pal,scale){
  scale=scale||1;var w=0;rows.forEach(function(r){w=Math.max(w,r.length)});
  var c=document.createElement('canvas');c.width=w*scale;c.height=rows.length*scale;var x=c.getContext('2d');
  rows.forEach(function(row,y){for(var i=0;i<row.length;i++){var col=pal[row[i]];if(col){x.fillStyle=col;x.fillRect(i*scale,y*scale,scale,scale)}}});
  return c;
}
function mix(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o}

var BUN_A=[
"................",
"......kk...kk...",
".....kwwk.kwwk..",
".....kwpk.kwpk..",
".....kwpk.kwpk..",
".....kwwkkkwwk..",
"....kkwwwwwwwkk.",
"...kwwwwwwwwwwk.",
"...kwwwwwwkwwwk.",
"...kwwwwwwwwppk.",
"..kkwwwwwwwwwwk.",
".kwwkwwwwwwwwwk.",
".kwwkwwwwwwwwk..",
"..kk.kwwwwwwk...",
".....kwwkkwwk...",
".....kkk..kkk..."];
var BUN_B=BUN_A.slice(0,14).concat([".....kwwwwwwk...","......kkkkkk...."]);
var ROBOT=[
"................",
".......rr.......",
".......kk.......",
"...kkkkkkkkkk...",
"..kHHBBBBBBBBk..",
"..kBkkkBBkkkBk..",
"..kBkRkBBkRkBk..",
"..kBkkkBBkkkBk..",
"..kBBgkgkgkBBk..",
"..kSSSSSSSSSSk..",
"...kkkkkkkkkk...",
"..kkBBBBBBBBkk..",
"..kBkBBBBBBkBk..",
"..kkk.kBBk.kkk..",
"....kGGGGGGGGk..",
"....kkkkkkkkkk.."];
var CARROT=["..l..l..","...ll...","..oooo..","..oyoo..","...oo...","...oo...","....o...","........"];
var ICONS={
 heart:[".kk.kk..","krrkrrk.","krrrrrk.","krrrrrk.",".krrrk..","..krk...","...k....","........"],
 shield:["kkkkkkk.","kbbbbbk.","kbwbbbk.","kbbbbbk.",".kbbbk..","..kbk...","...k....","........"],
 boots:["..kk....","..kwk...","..kwk...","..kwkkk.","kkkwwwwk","kwwwwwwk","kooooook","kkkkkkkk"],
 magnet:["rr....bb","rr....bb","ww....ww","ww....ww","ggg..ggg",".gggggg.","..gggg..","........"],
 gear:["...gg...",".g.gg.g.","..gGGg..","ggG..Ggg","ggG..Ggg","..gGGg..",".g.gg.g.","...gg..."],
 star:["...yy...","...yy...","yyyyyyyy",".yyyyyy.","..yyyy..",".yy..yy.","yy....yy","........"],
 carrot:CARROT
};
var GOLD=mix(PAL,{o:'#ffcd75',y:'#fff1b8'});
var RCOL={
 chaser:{B:'#b13e53',H:'#ef7d57',S:'#5d275d',R:'#f4f4f4'},
 ambusher:{B:'#257179',H:'#73eff7',S:'#29366f',R:'#f4f4f4'},
 wanderer:{B:'#38b764',H:'#a7f070',S:'#257179',R:'#f4f4f4'},
 turbo:{B:'#ffcd75',H:'#f4f4f4',S:'#ef7d57',R:'#b13e53'}
};
var S={};
S.bunA=sprite(BUN_A,PAL);S.bunB=sprite(BUN_B,PAL);
S.carrot=sprite(CARROT,PAL);S.gold=sprite(CARROT,GOLD,2);
Object.keys(RCOL).forEach(function(t){S['r_'+t]=sprite(ROBOT,mix(PAL,RCOL[t]))});
S.r_stun=sprite(ROBOT,mix(PAL,{B:'#3b5dc9',H:'#73eff7',S:'#29366f',R:'#f4f4f4'}));
S.r_flash=sprite(ROBOT,mix(PAL,{B:'#f4f4f4',H:'#f4f4f4',S:'#94b0c2',R:'#b13e53'}));
var IMG={},IMGS={};
Object.keys(ICONS).forEach(function(k){
  IMG[k]=sprite(ICONS[k],mix(PAL,{k:'#0d0e1a'}),5).toDataURL();
  IMGS[k]=sprite(ICONS[k],PAL,3).toDataURL();
});

/* ---------- audio (starts after first tap or key) ---------- */
var AC=null,muted=false;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function beep(f,d,type,v,slide){
  if(muted||!AC)return;d=d||0.08;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function arp(notes,step){notes.forEach(function(n,i){setTimeout(function(){beep(n,0.11)},i*(step||80))})}

/* ---------- maze generation ---------- */
function genMaze(){
  var g=[],x,y;
  for(y=0;y<ROWS;y++)g.push(new Array(COLS).fill(1));
  var stack=[[1,1]];g[1][1]=0;
  while(stack.length){
    var c=stack[stack.length-1],moved=false,dirs=shuffle([[2,0],[-2,0],[0,2],[0,-2]]);
    for(var i=0;i<4;i++){
      var dx=dirs[i][0],dy=dirs[i][1],nx=c[0]+dx,ny=c[1]+dy;
      if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&g[ny][nx]===1){
        g[c[1]+dy/2][c[0]+dx/2]=0;g[ny][nx]=0;stack.push([nx,ny]);moved=true;break;
      }
    }
    if(!moved)stack.pop();
  }
  /* open extra walls so the maze has loops */
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(g[y][x]===1&&((x%2===0&&y%2===1)||(x%2===1&&y%2===0))&&Math.random()<0.34)g[y][x]=0;
  }
  /* robot den */
  for(x=7;x<=11;x++)g[10][x]=0;
  /* remove dead ends */
  for(var pass=0;pass<2;pass++)for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(g[y][x]!==0)continue;
    var n=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){return g[y+d[1]][x+d[0]]===0});
    if(n.length===1){
      var walls=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){var wx=x+d[0],wy=y+d[1];return g[wy][wx]===1&&wx>0&&wx<COLS-1&&wy>0&&wy<ROWS-1});
      if(walls.length){var w=walls[rnd(walls.length)];g[y+w[1]][x+w[0]]=0}
    }
  }
  return g;
}

/* ---------- upgrades ---------- */
var UPS=[
 {id:'boots',name:'Springy Boots',desc:'Hop 12% faster.',icon:'boots',max:5},
 {id:'heart',name:'Extra Heart',desc:'+1 max heart and heal 1.',icon:'heart',max:3,ok:function(){return maxHp<6}},
 {id:'magnet',name:'Carrot Magnet',desc:'Grab carrots from further away.',icon:'magnet',max:3},
 {id:'gear',name:'Rusty Gears',desc:'Robots move 8% slower.',icon:'gear',max:4},
 {id:'shield',name:'Fluffy Shield',desc:'Blocks one robot hit every level.',icon:'shield',max:3},
 {id:'power',name:'Power Surge',desc:'Golden carrots last 2 seconds longer.',icon:'star',max:4},
 {id:'patch',name:'Carrot Patch',desc:'Two extra golden carrots in each maze.',icon:'carrot',max:2},
 {id:'stew',name:'Carrot Stew',desc:'Heal 2 hearts right now.',icon:'carrot',max:99,ok:function(){return hp<maxHp}}
];

/* ---------- game state ---------- */
var state='title',prevState='play',level=1,score=0,best=0,hp=3,maxHp=3,shields=0;
var up={},grid,pel,pelCount,player,robots,powerT,invuln,combo,particles,pops,shake,tAnim=0,introT,clearT,mazeCv,offers=[];
try{best=+localStorage.getItem('burrowbots.best')||0}catch(e){}
var START={x:9,y:19},DEN=[[9,10],[8,10],[10,10],[7,10],[11,10]];
var TYPES=['chaser','wanderer','ambusher','turbo','chaser'];

function resetRun(){
  level=1;score=0;hp=3;maxHp=3;
  up={boots:0,heart:0,magnet:0,gear:0,shield:0,power:0,patch:0};
}
function ent(x,y){return {tx:x,ty:y,dx:0,dy:0,pr:0,fx:0,fy:0,face:1,want:[0,0]}}
function open(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&grid[y][x]===0}
function isWall(x,y){return x<0||y<0||x>=COLS||y>=ROWS||grid[y][x]===1}
function pos(e){return {x:e.tx+e.dx*e.pr,y:e.ty+e.dy*e.pr}}

function buildMaze(){
  var c=document.createElement('canvas');c.width=W;c.height=H;var m=c.getContext('2d');
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    var px=x*TS,py=y*TS;
    if(grid[y][x]===0){
      m.fillStyle=((x+y)%2)?'#1a1c2c':'#1c1e31';m.fillRect(px,py,TS,TS);
      m.fillStyle='#262a42';
      for(var i=0;i<3;i++)m.fillRect(px+rnd(15),py+rnd(15),1,1);
    }else{
      m.fillStyle='#257179';m.fillRect(px,py,TS,TS);
      for(var j=0;j<7;j++){m.fillStyle=Math.random()<0.5?'#2d8a8a':'#1d5a66';m.fillRect(px+rnd(15),py+rnd(15),2,1)}
      m.fillStyle='#38b764';
      if(!isWall(x,y-1))m.fillRect(px,py,TS,3);
      if(!isWall(x,y+1))m.fillRect(px,py+TS-3,TS,3);
      if(!isWall(x-1,y))m.fillRect(px,py,3,TS);
      if(!isWall(x+1,y))m.fillRect(px+TS-3,py,3,TS);
      m.fillStyle='#a7f070';
      if(!isWall(x,y-1))m.fillRect(px,py+(isWall(x,y-1)?0:2),TS,1);
      if(!isWall(x,y+1))m.fillRect(px,py+TS-3,TS,1);
      if(!isWall(x-1,y))m.fillRect(px+2,py,1,TS);
      if(!isWall(x+1,y))m.fillRect(px+TS-3,py,1,TS);
    }
  }
  mazeCv=c;
}

function newLevel(){
  grid=genMaze();buildMaze();
  pel=[];pelCount=0;
  for(var y=0;y<ROWS;y++){pel.push([]);for(var x=0;x<COLS;x++){
    var v=0;
    if(grid[y][x]===0&&!(x===START.x&&y===START.y)&&!(y===10&&x>=7&&x<=11))v=1;
    pel[y].push(v);if(v)pelCount++;
  }}
  [[1,1],[17,1],[1,19],[17,19]].forEach(function(p){if(pel[p[1]][p[0]]!==2){pel[p[1]][p[0]]=2}});
  var extra=up.patch*2,tries=0;
  while(extra>0&&tries++<300){
    var rx=1+rnd(COLS-2),ry=1+rnd(ROWS-2);
    if(pel[ry][rx]===1&&Math.abs(rx-START.x)+Math.abs(ry-START.y)>5){pel[ry][rx]=2;extra--}
  }
  pelCount=0;for(var yy=0;yy<ROWS;yy++)for(var xx=0;xx<COLS;xx++)if(pel[yy][xx])pelCount++;
  player=ent(START.x,START.y);
  var n=Math.min(2+Math.floor((level-1)/2),5);
  robots=[];
  for(var i=0;i<n;i++){var r=ent(DEN[i][0],DEN[i][1]);r.type=TYPES[i];r.id=i;r.wait=1+i*1.4;r.dead=0;robots.push(r)}
  powerT=0;invuln=0;combo=0;particles=[];pops=[];shake=0;shields=up.shield;
  introT=1.5;state='intro';
  $('overlay').hidden=true;
  hud();
}
function resetPositions(){
  player.tx=START.x;player.ty=START.y;player.dx=player.dy=0;player.pr=0;
  robots.forEach(function(r,i){r.tx=DEN[i][0];r.ty=DEN[i][1];r.dx=r.dy=0;r.pr=0;r.fx=r.fy=0;r.wait=1.2+i*0.7;r.dead=0});
  powerT=0;combo=0;
}

/* ---------- HUD ---------- */
function hud(){
  $('lvl').textContent=level;$('score').textContent=score;$('best').textContent=best;
  var s='';
  for(var i=0;i<maxHp;i++)s+='<img class="ic'+(i<hp?'':' off')+'" src="'+IMGS.heart+'" alt="">';
  for(var j=0;j<shields;j++)s+='<img class="ic" src="'+IMGS.shield+'" alt="">';
  var h=$('hearts');h.innerHTML=s;h.setAttribute('aria-label',hp+' of '+maxHp+' hearts, '+shields+' shields');
  renderOwned();
}
function renderOwned(){
  var items=UPS.filter(function(u){return u.id!=='stew'&&up[u.id]>0});
  $('owned').innerHTML='<span class="t">BACKPACK</span>'+(items.length?items.map(function(u){
    return '<span class="chip" title="'+u.name+'"><img class="ic" src="'+IMGS[u.icon]+'" alt="'+u.name+'">x'+up[u.id]+'</span>';
  }).join(''):'<span class="empty">Empty. Clear a level to pick your first upgrade.</span>');
}

/* ---------- movement ---------- */
function stepEnt(e,speed,dt,choose){
  var rem=speed*dt,guard=0;
  while(rem>0&&guard++<4){
    if(e.dx===0&&e.dy===0){choose(e);if(e.dx===0&&e.dy===0)return}
    var need=1-e.pr;
    if(rem>=need){e.tx+=e.dx;e.ty+=e.dy;e.pr=0;rem-=need;e.dx=0;e.dy=0}
    else{e.pr+=rem;rem=0}
  }
}
function choosePlayer(e){
  var w=e.want;
  if((w[0]||w[1])&&open(e.tx+w[0],e.ty+w[1])){e.dx=w[0];e.dy=w[1];e.fx=w[0];e.fy=w[1];if(w[0])e.face=w[0];return}
  if((e.fx||e.fy)&&open(e.tx+e.fx,e.ty+e.fy)){e.dx=e.fx;e.dy=e.fy;return}
  e.dx=0;e.dy=0;
}
function setWant(d){
  if(!player)return;
  player.want=d;
  if((player.dx||player.dy)&&d[0]===-player.dx&&d[1]===-player.dy&&player.pr>0){
    player.tx+=player.dx;player.ty+=player.dy;player.dx=d[0];player.dy=d[1];player.pr=1-player.pr;
    player.fx=d[0];player.fy=d[1];if(d[0])player.face=d[0];
  }
}
function chooseRobot(r){
  var all=[[1,0],[-1,0],[0,1],[0,-1]];
  var opts=all.filter(function(d){return open(r.tx+d[0],r.ty+d[1])});
  var fwd=opts.filter(function(d){return !(d[0]===-r.fx&&d[1]===-r.fy)});
  if(fwd.length)opts=fwd;
  if(!opts.length)return;
  var pp=pos(player),tx=pp.x,ty=pp.y,pick,i;
  function dist(d){var x=r.tx+d[0]-tx,y=r.ty+d[1]-ty;return x*x+y*y}
  if(powerT>0){
    pick=opts[0];for(i=1;i<opts.length;i++)if(dist(opts[i])>dist(pick))pick=opts[i];
  }else if(Math.random()<(r.type==='wanderer'?0.65:0.1)){
    pick=opts[rnd(opts.length)];
  }else{
    if(r.type==='ambusher'){tx+=player.fx*4;ty+=player.fy*4}
    pick=opts[0];for(i=1;i<opts.length;i++)if(dist(opts[i])<dist(pick))pick=opts[i];
  }
  r.dx=pick[0];r.dy=pick[1];r.fx=pick[0];r.fy=pick[1];
}

/* ---------- effects ---------- */
function burst(px,py,cols,n){
  for(var i=0;i<n;i++){var a=Math.random()*6.28,s=30+Math.random()*60;
    particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.5+Math.random()*0.3,c:cols[rnd(cols.length)]})}
}
function pop(px,py,txt){pops.push({x:px,y:py,t:txt,life:0.9})}

/* ---------- rules ---------- */
function eat(x,y){
  var v=pel[y][x];if(!v||state!=='play')return;
  pel[y][x]=0;pelCount--;
  if(v===1){score+=10;beep(pelCount%2?520:620,0.05,'square',0.03)}
  else{score+=50;powerT=6+2*up.power;combo=0;beep(300,0.25,'square',0.05,500);pop(x*TS+8,y*TS,'POWER')}
  if(score>best){best=score;try{localStorage.setItem('burrowbots.best',String(best))}catch(e){}}
  $('score').textContent=score;$('best').textContent=best;
  if(pelCount===0){state='clear';clearT=1.3;score+=100*level;hud();arp([523,659,784,1047],110)}
}
function collect(){
  var p=pos(player),cx=Math.round(p.x),cy=Math.round(p.y);
  eat(cx,cy);
  if(up.magnet){
    var R=0.6+0.55*up.magnet,r=Math.ceil(R);
    for(var y=cy-r;y<=cy+r;y++)for(var x=cx-r;x<=cx+r;x++){
      if(y>=0&&y<ROWS&&x>=0&&x<COLS&&pel[y][x]&&Math.hypot(x-p.x,y-p.y)<=R)eat(x,y);
    }
  }
}
function hitPlayer(r){
  var p=pos(player);
  if(shields>0){shields--;invuln=1.5;burst(p.x*TS+8,p.y*TS+8,['#41a6f6','#73eff7','#f4f4f4'],14);beep(220,0.2,'square',0.05,-120);hud();return}
  hp--;shake=0.35;burst(p.x*TS+8,p.y*TS+8,['#b13e53','#ef7d57','#f4f4f4'],18);beep(180,0.4,'sawtooth',0.06,-120);
  if(hp<=0){hud();gameOver();return}
  resetPositions();invuln=2.2;hud();
}
function update(dt){
  tAnim+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  particles=particles.filter(function(p){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;return p.life>0});
  pops=pops.filter(function(p){p.life-=dt;p.y-=14*dt;return p.life>0});
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return}
  if(state==='clear'){clearT-=dt;if(clearT<=0)openUpgrades();return}
  if(state!=='play')return;
  stepEnt(player,4.8*(1+0.12*up.boots),dt,choosePlayer);
  collect();
  if(state!=='play')return;
  if(powerT>0){powerT-=dt;if(powerT<=0){powerT=0;combo=0}}
  if(invuln>0)invuln-=dt;
  var base=Math.min(3.6+0.14*(level-1),5)*(1-0.08*up.gear),pp=pos(player);
  for(var i=0;i<robots.length;i++){
    var r=robots[i];
    if(r.dead>0){r.dead-=dt;if(r.dead<=0){r.tx=DEN[i][0];r.ty=DEN[i][1];r.dx=r.dy=0;r.pr=0;r.fx=r.fy=0;r.wait=0.6}continue}
    if(r.wait>0){r.wait-=dt;continue}
    var sp=base*(r.type==='turbo'?1.22:1)*(powerT>0?0.55:1);
    stepEnt(r,sp,dt,chooseRobot);
    var rp=pos(r);
    if(Math.hypot(rp.x-pp.x,rp.y-pp.y)<0.65){
      if(powerT>0){
        var pts=200*Math.pow(2,Math.min(combo,3));combo++;score+=pts;
        burst(rp.x*TS+8,rp.y*TS+8,['#ffcd75','#f4f4f4','#73eff7'],16);pop(rp.x*TS+8,rp.y*TS,String(pts));
        r.dead=3;beep(700,0.18,'square',0.05,500);
        if(score>best){best=score;try{localStorage.setItem('burrowbots.best',String(best))}catch(e){}}
        $('score').textContent=score;$('best').textContent=best;
      }else if(invuln<=0){hitPlayer(r);if(state!=='play')return;break}
    }
  }
}

/* ---------- drawing ---------- */
function draw(){
  ctx.save();
  if(shake>0)ctx.translate(Math.round((Math.random()-0.5)*shake*14),Math.round((Math.random()-0.5)*shake*14));
  ctx.drawImage(mazeCv,0,0);
  var x,y;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    var v=pel[y][x];
    if(v===1)ctx.drawImage(S.carrot,x*TS+4,y*TS+4);
    else if(v===2)ctx.drawImage(S.gold,x*TS,y*TS+Math.round(Math.sin(tAnim*6+x)*1.2));
  }
  robots.forEach(function(r){
    if(r.dead>0)return;
    var p=pos(r),spr,bob=Math.round(Math.sin(tAnim*10+r.id*2)*0.8);
    if(powerT>0)spr=(powerT<2&&Math.floor(tAnim*8)%2)?S.r_flash:S.r_stun;else spr=S['r_'+r.type];
    ctx.drawImage(spr,Math.round(p.x*TS),Math.round(p.y*TS)+bob);
  });
  var pp=pos(player);
  if(!(invuln>0&&Math.floor(tAnim*12)%2)){
    var moving=player.dx||player.dy,hop=moving?-Math.abs(Math.sin(tAnim*14))*2:0;
    var spr2=(moving&&Math.floor(tAnim*10)%2)?S.bunB:S.bunA;
    ctx.save();ctx.translate(Math.round(pp.x*TS+8),Math.round(pp.y*TS+hop));ctx.scale(player.face<0?-1:1,1);ctx.drawImage(spr2,-8,0);ctx.restore();
    if(shields>0){
      var bx=Math.round(pp.x*TS),by=Math.round(pp.y*TS);
      ctx.globalAlpha=0.55+0.25*Math.sin(tAnim*8);ctx.fillStyle='#73eff7';
      ctx.fillRect(bx+2,by,12,1);ctx.fillRect(bx+2,by+15,12,1);ctx.fillRect(bx,by+2,1,12);ctx.fillRect(bx+15,by+2,1,12);
      ctx.fillRect(bx+1,by+1,1,1);ctx.fillRect(bx+14,by+1,1,1);ctx.fillRect(bx+1,by+14,1,1);ctx.fillRect(bx+14,by+14,1,1);
      ctx.globalAlpha=1;
    }
  }
  particles.forEach(function(p){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2)});
  ctx.textAlign='center';ctx.font='8px "Press Start 2P",monospace';
  pops.forEach(function(p){ctx.fillStyle='#0d0e1a';ctx.fillText(p.t,Math.round(p.x)+1,Math.round(p.y)+1);ctx.fillStyle='#ffcd75';ctx.fillText(p.t,Math.round(p.x),Math.round(p.y))});
  if(powerT>0){ctx.fillStyle='#ffcd75';ctx.fillRect(0,H-3,Math.round(W*Math.min(1,powerT/(6+2*up.power))),3)}
  if(state==='intro'||state==='clear'){
    var msg=state==='intro'?'LEVEL '+level:'LEVEL CLEAR!';
    ctx.font='16px "Press Start 2P",monospace';
    ctx.fillStyle='#0d0e1a';ctx.fillText(msg,W/2+2,H/2+2);ctx.fillStyle='#ffcd75';ctx.fillText(msg,W/2,H/2);
  }
  ctx.restore();
}

/* ---------- overlays ---------- */
function showOverlay(html){var o=$('overlay');o.innerHTML=html;o.hidden=false;return o}
function showTitle(){
  state='title';
  var o=showOverlay('<div class="panel"><h2>Burrow Bots</h2><p>Hop through the garden maze and eat every carrot. Rogue robots are loose in the burrow. Grab a golden carrot to scare them off.</p><p class="sub">Clear a level to pick one of three upgrades. Lose all your hearts and the run is over.</p><button class="btn" id="startBtn" type="button">START HOPPING</button></div>');
  $('startBtn').onclick=startRun;
}
function startRun(){audio();resetRun();newLevel()}
function gameOver(){
  state='over';
  var o=showOverlay('<div class="panel"><h2>Run over</h2><div class="stats3"><div><span>LEVEL</span> '+level+'</div><div><span>SCORE</span> '+score+'</div><div><span>BEST</span> '+best+'</div></div><p class="sub">The robots got you. Every run builds a different maze.</p><button class="btn" id="againBtn" type="button">HOP AGAIN</button></div>');
  $('againBtn').onclick=startRun;
  arp([392,330,262,196],130);
}
function pickOffers(){
  var pool=UPS.filter(function(u){return (u.ok?u.ok():true)&&(u.id==='stew'||up[u.id]<u.max)});
  return shuffle(pool).slice(0,3);
}
function openUpgrades(){
  offers=pickOffers();
  if(!offers.length){level++;newLevel();return}
  state='upgrade';
  var cards=offers.map(function(u,i){
    var own=u.id==='stew'?'':'<span class="own"> You have '+up[u.id]+'.</span>';
    return '<button class="card" id="up-'+u.id+'" type="button" data-i="'+i+'"><img src="'+IMG[u.icon]+'" alt=""><span><b>'+(i+1)+'. '+u.name+'</b><span class="d">'+u.desc+own+'</span></span></button>';
  }).join('');
  var o=showOverlay('<div class="panel"><h2>Level '+level+' clear</h2><p>Pick an upgrade for the next burrow.</p><div class="cards">'+cards+'</div></div>');
  Array.prototype.forEach.call(o.querySelectorAll('.card'),function(b){b.onclick=function(){pickUpgrade(+b.getAttribute('data-i'))}});
}
function pickUpgrade(i){
  var u=offers[i];if(!u||state!=='upgrade')return;
  if(u.id==='stew')hp=Math.min(maxHp,hp+2);
  else{up[u.id]++;if(u.id==='heart'){maxHp++;hp=Math.min(maxHp,hp+1)}}
  arp([440,554,659],70);
  level++;newLevel();
}
function togglePause(){
  if(state==='play'||state==='intro'||state==='clear'){
    prevState=state;state='paused';
    var o=showOverlay('<div class="panel"><h2>Paused</h2><button class="btn" id="resumeBtn" type="button">RESUME</button></div>');
    $('resumeBtn').onclick=togglePause;
  }else if(state==='paused'){
    state=prevState;$('overlay').hidden=true;
  }
}

/* ---------- input ---------- */
var KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
window.addEventListener('keydown',function(e){
  var k=e.key,d=KEYS[k]||KEYS[(k||'').toLowerCase()];
  audio();
  if(d){e.preventDefault();if(state==='play'||state==='intro')setWant(d);return}
  if(k==='p'||k==='P'||k==='Escape'){togglePause();return}
  if(state==='upgrade'&&(k==='1'||k==='2'||k==='3')){pickUpgrade(+k-1);return}
  if((k==='Enter'||k===' ')&&(state==='title'||state==='over')){e.preventDefault();startRun();return}
  if(k===' ')e.preventDefault();
});
var sx=0,sy=0,swiping=false,stage=$('stage');
stage.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;swiping=true},{passive:true});
stage.addEventListener('touchmove',function(e){
  if(!swiping)return;e.preventDefault();
  var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;
  var d=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1];
  if(state==='play'||state==='intro')setWant(d);
  sx=t.clientX;sy=t.clientY;
},{passive:false});
stage.addEventListener('touchend',function(){swiping=false});
Array.prototype.forEach.call(document.querySelectorAll('#pad button'),function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();audio();if(state==='play'||state==='intro')setWant([+b.getAttribute('data-dx'),+b.getAttribute('data-dy')])});
});
$('pauseBtn').onclick=function(){togglePause()};
$('muteBtn').onclick=function(){audio();muted=!muted;$('muteBtn').textContent=muted?'SOUND OFF':'SOUND ON'};
document.addEventListener('visibilitychange',function(){if(document.hidden&&(state==='play'||state==='intro'))togglePause()});

/* ---------- boot ---------- */
resetRun();newLevel();showTitle();
var last=performance.now();
function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>

</body></html>
