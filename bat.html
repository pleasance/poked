<style>
/* Layout: one centered portrait cabinet screen, a thin title row above it and a status row below. Single dark look by choice. */
:root {
  --void: #0e0720;
  --void-2: #130a29;
  --ink: #f6e9ff;

  --pink: #ff4fa3;

  --gold: #ffd84a;

}
html, body { height: 100%; }
body {

  background-size: 48px 48px;

  font-family: var(--body);
  font-size: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
  --sw: min(100%, calc((100dvh - 130px) * 0.5625), 440px);
}
.bar {
  width: var(--sw);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.bar b { color: var(--gold); font-weight: normal; font-variant-numeric: tabular-nums; }
.hint { font-family: var(--body); font-size: 19px; letter-spacing: 0.04em; text-transform: none; min-width: 0; }
#snd {
  font: inherit;
  font-family: var(--display);
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--teal);
  background: transparent;

}
#snd[aria-pressed="false"] { color: var(--muted); border-color: var(--muted); }

.screen {

  max-width: 100%;
  container-type: inline-size;
  background: #000;
  box-shadow: 0 0 0 3px var(--plum), 0 0 0 6px var(--pink);

  touch-action: none;

  -webkit-user-select: none;
  cursor: pointer;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }

.crt {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(8,2,20,.6) 100%);
}
.crt::after {
  content: ""; position: absolute; left: 0; right: 0; top: -20%; height: 18%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.06), transparent);
  animation: roll 7s linear infinite;
}
@keyframes roll { to { top: 110%; } }

.hud {
  position: absolute; top: 6cqw; left: 0; right: 0; text-align: center; pointer-events: none;
  font-family: var(--display); font-size: 11cqw; color: var(--ink);
  font-variant-numeric: tabular-nums;
  text-shadow: .7cqw 0 var(--pink), -.7cqw 0 var(--teal), 0 1cqw 0 #14081f;

.panel {
  position: absolute; left: 8cqw; right: 8cqw; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4.5cqw;
  padding: 6cqw 4cqw;
  text-align: center;
  background: rgba(14, 7, 32, .9);
  border: 1cqw solid var(--ink);
  box-shadow: 2cqw 2cqw 0 var(--pink);
  pointer-events: none;
}

@keyframes tear {

.panel .line.new { color: var(--gold); }
.stats { display: flex; justify-content: space-around; width: 100%; font-family: var(--display); font-size: 3.4cqw; color: var(--muted); }
.stats span { display: flex; flex-direction: column; gap: 2cqw; align-items: center; }
.stats b { font-weight: normal; font-size: 6cqw; color: var(--gold); font-variant-numeric: tabular-nums; }

<header class="bar"><span>Down the Bat Hole</span><span>Best <b id="best">0</b></span></header>

<script>

  ]);
  var near = makeLayer(6, 240, 0.4, [
    { cw: [30, 40], sh: [16, 34], ch: [12, 16], cap: '#8a2f8e', spot: '#d98ae8', stem: '#4a1d6e' },
    { cw: [28, 36], sh: [18, 30], ch: [12, 15], cap: '#1f8f9a', spot: '#9ff5e6', stem: '#1d4c6e' }

      var th = (B[(y & 3) * 4 + (xx & 3)] + 0.5) / 16;
      var c = f > th ? P[i + 1] : P[i];
      var o = (y * W + xx) * 4; id.data[o] = c[0]; id.data[o + 1] = c[1]; id.data[o + 2] = c[2]; id.data[o + 3] = 255;
    }

  })();
  var stars = [];
  for (var si = 0; si < 28; si++) stars.push({ x: (Math.random() * W) | 0, y: (Math.random() * 150) | 0, s: Math.random() < 0.2 ? 2 : 1, c: pick(['#f6e9ff', '#f6e9ff', '#ffd84a', '#35e6c9']), sp: rand(1, 4), ph: rand(0, 6) });

  for (var fi0 = 0; fi0 < 10; fi0++) flutter.push({ x: rand(0, W), y: rand(0, GY), vy: rand(0.12, 0.3), sp: rand(1.5, 3), ph: rand(0, 6), c: pick(['#f4ecd8', '#ff4fa3', '#f4ecd8']) });

  var best = 0;

  var pillars = [], parts = [];
  var glitch = 0, kick = 0, burstLeft = 0, burstAmp = 0, glitchTimer = 2, flash = 0, shake = 0, curFilter = '';

  /* ---------- game flow ---------- */
  var FLAVOR = ['The Queen is not amused.', 'Late again. Always late.', 'Mind the hedge cards.', 'That hole went deeper than expected.', 'The Cat grins. You do not.', 'Even the teapot saw that coming.'];

      var th = Math.max(1, Math.round(5 * (1 - Math.abs(x) / 28)));
      g.fillStyle = (((x + 27) % 7 === 0) && th >= 3) ? '#9a7bd1' : '#fff3c4';
      g.fillRect(cx + x, cy + yo - th, 1, th);
    }
    if (((t * 0.5) % 6) <= 5.75) {
      g.fillStyle = '#c8ff3d';
      g.fillRect(cx - 20, cy - 10, 5, 2); g.fillRect(cx - 18, cy - 8, 4, 1);
      g.fillRect(cx + 15, cy - 10, 5, 2); g.fillRect(cx + 14, cy - 8, 4, 1);
      g.fillStyle = '#14081f';
      g.fillRect(cx - 17, cy - 10, 1, 2); g.fillRect(cx + 17, cy - 10, 1, 2);
    }
    g.restore();
  }
  function drawLayer(L) {
    for (var i = 0; i < L.items.length; i++) {
      var m = L.items[i];
      var x = Math.floor(((m.x - scroll * L.factor) % L.period + L.period) % L.period) - 40;
      if (x < W) g.drawImage(m.spr, x, GY - m.spr.height + 2);
    }
  }
  function drawBG() {
    g.drawImage(bgc, 0, 0);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (Math.sin(t * s.sp + s.ph) > 0.1) { g.fillStyle = s.c; g.fillRect(s.x, s.y, s.s, s.s); }
    }
    drawMoon();
    drawLayer(far); drawLayer(near);
    g.save(); g.globalAlpha = 0.6;
    for (var f = 0; f < flutter.length; f++) {
      var fl = flutter[f];
      var w = 1 + Math.round(Math.abs(Math.sin(t * fl.sp + fl.ph)) * 2);
      g.fillStyle = fl.c;
      g.fillRect(Math.round(fl.x + Math.sin(t + fl.ph) * 6), Math.round(fl.y), w, 4);
    }
    g.restore();
  }
  function drawCard(x, y, suit, back) {
    x = Math.round(x); y = Math.round(y);
    g.fillStyle = '#14081f'; g.fillRect(x, y, PW, CH);
    g.fillStyle = back ? '#d83d8e' : '#f4ecd8'; g.fillRect(x + 1, y + 1, PW - 2, CH - 2);
    if (back) {
      g.fillStyle = '#35e6c9';
      for (var b = 0; b < 6; b++) for (var a = 0; a < 5; a++) if ((a + b) % 2 === 0) g.fillRect(x + 3 + a * 4, y + 3 + b * 4, 2, 2);
      g.fillStyle = '#f4ecd8';
      g.fillRect(x + 2, y + 2, PW - 4, 1); g.fillRect(x + 2, y + CH - 3, PW - 4, 1);
      g.fillRect(x + 2, y + 2, 1, CH - 4); g.fillRect(x + PW - 3, y + 2, 1, CH - 4);
    } else {
      g.fillStyle = '#d9ccb0'; g.fillRect(x + 1, y + CH - 2, PW - 2, 1);
      var s = suits[suit];
      g.drawImage(s, x + 2, y + 3);
      g.drawImage(s, x + PW - 7, y + CH - 8);
      g.drawImage(s, x + 7, y + 10, 10, 10);
    }
  }
  function drawPillar(p) {
    var top = p.gy - GAP / 2, bot = p.gy + GAP / 2, k, y, xo;
    for (k = 0; ; k++) {
      y = top - CH * (k + 1); if (y + CH <= 0) break;
      xo = ((p.id * 3 + k * 2) % 3) - 1;
      if (glitch > 0.3 && Math.random() < 0.2) xo += Math.round(rand(-3, 3));
      drawCard(p.x + xo, y, (p.id + k * 2) & 3, (p.id + k * 7) % 5 === 0);
    }
    for (k = 0; ; k++) {
      y = bot + CH * k; if (y >= GY) break;
      xo = ((p.id * 3 + k * 2 + 1) % 3) - 1;
      if (glitch > 0.3 && Math.random() < 0.2) xo += Math.round(rand(-3, 3));
      drawCard(p.x + xo, y, (p.id + k * 2 + 3) & 3, (p.id + k * 7 + 2) % 5 === 0);
    }
  }
  function drawGround() {
    g.fillStyle = '#14081f'; g.fillRect(0, GY, W, H - GY);
    var ox = -(Math.floor(scroll) % 24);
    for (var r = 0; r < 2; r++) for (var i = 0; i < 14; i++) {
      g.fillStyle = ((i + r) & 1) === 0 ? '#f4ecd8' : '#2b1740';
      g.fillRect(ox + i * 12, GY + 2 + r * 12, 12, 12);
    }
    g.fillStyle = 'rgba(20,8,31,.28)'; g.fillRect(0, GY + 14, W, 12);
    g.fillStyle = '#ff4fa3'; g.fillRect(0, GY, W, 2);
  }
  function put(c, x, y, flip) {
    if (!flip) { g.drawImage(c, x, y); return; }
    g.save(); g.translate(0, y * 2 + c.height); g.scale(1, -1); g.drawImage(c, x, y); g.restore();
  }
  function drawBat() {
    var fi = state === 'dead' ? 1 : ((bat.tick >> (bat.vy < -1 ? 2 : 3)) & 1);
    var bx = Math.round(bat.x - 7), by = Math.round(bat.y - 4), flip = state === 'dead';
    if (glitch > 0.2) {
      g.save(); g.globalAlpha = 0.65;
      put(batC[fi], bx - 3, by, flip); put(batM[fi], bx + 3, by + 1, flip);
      g.restore();
    }
    put(batN[fi], bx, by, flip);
  }
  function post() {
    if (shake > 0) { vctx.fillStyle = '#000'; vctx.fillRect(0, 0, W, H); }
    var ox = shake > 0 ? Math.round(rand(-shake, shake)) : 0, oy = shake > 0 ? Math.round(rand(-shake, shake)) : 0;
    vctx.drawImage(gc, ox, oy);
    var f = '';
    if (glitch > 0.6 && Math.random() < 0.25) f = Math.random() < 0.4 ? 'invert(1)' : 'hue-rotate(' + ((Math.random() * 360) | 0) + 'deg) saturate(1.5)';
    if (f !== curFilter) { view.style.filter = f; curFilter = f; }
    if (glitch < 0.04) return;
    var n = Math.floor(2 + glitch * 9), i;
    for (i = 0; i < n; i++) {
      var sy = (Math.random() * (H - 8)) | 0, sh = (2 + Math.random() * 18) | 0, dx = Math.round((Math.random() - 0.5) * 2 * glitch * 26);
      vctx.drawImage(gc, 0, sy, W, sh, dx, sy, W, sh);
    }
    if (glitch > 0.12) {
      var s = Math.max(1, Math.round(glitch * 3.2));
      var id = vctx.getImageData(0, 0, W, H), d = id.data, o = post.out || (post.out = new ImageData(W, H)), od = o.data;
      for (var y = 0; y < H; y++) {
        var row = y * W * 4;
        for (var x = 0; x < W; x++) {
          var idx = row + x * 4, xr = x - s < 0 ? 0 : x - s, xb = x + s > W - 1 ? W - 1 : x + s;
          od[idx] = d[row + xr * 4]; od[idx + 1] = d[idx + 1]; od[idx + 2] = d[row + xb * 4 + 2]; od[idx + 3] = 255;
        }
      }
      vctx.putImageData(o, 0, 0);
    }
    var nb = Math.floor(glitch * 10);
    for (i = 0; i < nb; i++) {
      vctx.globalAlpha = rand(0.5, 1);
      vctx.fillStyle = pick(['#ff4fa3', '#35e6c9', '#ffd84a', '#ffffff', '#14081f']);
      vctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 3 + ((Math.random() * 16) | 0), 1 + ((Math.random() * 2) | 0));
    }
    vctx.globalAlpha = 1;
  }
  function render() {
    drawBG();
    for (var i = 0; i < pillars.length; i++) drawPillar(pillars[i]);
    drawGround();
    drawBat();
    for (var q = 0; q < parts.length; q++) { var p = parts[q]; g.fillStyle = p.c; g.fillRect(Math.round(p.x), Math.round(p.y), p.z, p.z); }
    if (flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (flash * 0.8).toFixed(2) + ')'; g.fillRect(0, 0, W, H); }
    post();
  }

  /* ---------- input & loop ---------- */
  el.screen.addEventListener('pointerdown', function (e) { e.preventDefault(); act(); });
  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault(); if (!e.repeat) act();
    }
  });
  el.snd.addEventListener('click', function () {
    muted = !muted;
    el.snd.textContent = muted ? 'Sound off' : 'Sound on';
    el.snd.setAttribute('aria-pressed', muted ? 'false' : 'true');
    if (!muted) { ac(); tone(520, 780, 0.08, 'square', 0.04); }
  });

  /* ---------- gamepad ---------- */
  var padDown = false, padOn = false, hintEl = document.getElementById('hint');
  var PAD_BUTTONS = [0, 1, 2, 3, 4, 5, 6, 7, 9, 12]; /* face buttons, shoulders, triggers, start, d-pad up */
  function setPadHint(on) {
    if (on === padOn) return; padOn = on;
    hintEl.textContent = on ? 'Controller ready: press A to flap' : 'Space, click or tap to flap';
  }
  function getPads() {
    try { return navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { return []; }
  }
  function pollPad() {
    var pads = getPads(), down = false, found = false;
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i]; if (!p || !p.connected) continue;
      found = true;
      for (var j = 0; j < PAD_BUTTONS.length; j++) {
        var b = p.buttons[PAD_BUTTONS[j]];
        if (b && (b.pressed || b.value > 0.5)) down = true;
      }
    }
    setPadHint(found);
    if (down && !padDown) act();
    padDown = down;
  }
  function rumble() {
    var pads = getPads();
    for (var i = 0; i < pads.length; i++) {
      var a = pads[i] && pads[i].vibrationActuator;
      if (a && a.playEffect) { try { a.playEffect('dual-rumble', { duration: 220, strongMagnitude: 1, weakMagnitude: 0.5 }); } catch (e) {} }
    }
  }
  window.addEventListener('gamepaddisconnected', function () { padDown = false; });

  var last = performance.now(), acc = 0;
  function frame(now) {
    pollPad();
    var dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    while (acc >= 1 / 60) { step(); acc -= 1 / 60; }
    render();
    requestAnimationFrame(frame);
  }
  showPanel('start');
  requestAnimationFrame(frame);
})();
</script>
