<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Glitch Horizon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: full-screen letterboxed pixel canvas, touch pads float at the bottom corners. Single dark look by choice. */
:root{
  --void:#0b0614; --ink:#1a0f2e; --pink:#ff4fa3; --orange:#ff8a1f; --cyan:#2ef2ff; --violet:#7a3cff;
  --font-px:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--cyan);font-family:var(--font-px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
#stage.portrait{align-items:flex-start;padding-top:8px}
#wrap{position:relative;line-height:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:var(--void);outline:none}
#crt{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(5,0,15,.55) 100%)}
#touch{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:5}
#touch .b{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  font:700 14px var(--font-px);color:var(--cyan);background:rgba(26,15,46,.72);border:3px solid var(--violet);
  width:64px;height:64px;box-shadow:4px 4px 0 rgba(0,0,0,.5);touch-action:none}
#touch .b.on{background:var(--violet);color:#fff;transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#touch .big{width:84px;height:84px;font-size:11px}
#bLeft{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#bRight{left:calc(max(14px,env(safe-area-inset-left,0px)) + 76px);bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#bUp{left:calc(max(14px,env(safe-area-inset-left,0px)) + 38px);bottom:calc(100px + env(safe-area-inset-bottom,0px));width:56px;height:56px;font-size:11px}
#bJump{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));border-color:var(--orange);color:var(--orange)}
#bHole{right:calc(max(14px,env(safe-area-inset-right,0px)) + 96px);bottom:calc(76px + env(safe-area-inset-bottom,0px));border-color:var(--pink);color:var(--pink)}
#bPause{right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:36px;font-size:10px;position:fixed}
@media (max-height:420px){#touch .b{width:54px;height:54px}#touch .big{width:68px;height:68px}#bRight{left:calc(max(14px,env(safe-area-inset-left,0px)) + 64px)}#bUp{left:calc(max(14px,env(safe-area-inset-left,0px)) + 32px);bottom:calc(88px + env(safe-area-inset-bottom,0px))}#bHole{right:calc(max(14px,env(safe-area-inset-right,0px)) + 80px);bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
</style>
<div id="stage"><div id="wrap"><canvas id="c" width="320" height="180" tabindex="0" aria-label="Glitch Horizon game"></canvas><div id="crt"></div></div></div>
<div id="touch" hidden>
  <div class="b" id="bLeft" data-k="left">&#9664;</div>
  <div class="b" id="bRight" data-k="right">&#9654;</div>
  <div class="b" id="bUp" data-k="up">AIM</div>
  <div class="b big" id="bHole" data-k="hole">HOLE</div>
  <div class="b big" id="bJump" data-k="jump">JUMP</div>
  <div class="b" id="bPause" data-k="start">II</div>
</div>
<script>
(()=>{
'use strict';
const W=320,H=180,T=16;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const b=buf.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');
const stage=document.getElementById('stage'),touchEl=document.getElementById('touch');
const isTouch=(matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)touchEl.hidden=false;
function resize(){
  const w=innerWidth-32,h=innerHeight;const portrait=isTouch&&h>w*1.1;
  let s=Math.min(w/W,h/H);if(s>=2)s=Math.floor(s);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';stage.classList.toggle('portrait',portrait);
}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function unlock(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}
function noise(d,v){if(!AC)return;const n=AC.sampleRate*d|0,bf=AC.createBuffer(1,n,AC.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v||.08;s.buffer=bf;s.connect(g);g.connect(AC.destination);s.start();}
const SFX={jump:()=>tone(300,.14,'square',.04,380),wall:()=>tone(240,.12,'square',.04,300),
  hole:()=>{tone(700,.35,'sawtooth',.05,-600);},kill:()=>{noise(.18,.09);tone(180,.2,'square',.05,-120);},
  die:()=>{noise(.4,.12);tone(220,.5,'sawtooth',.07,-190);},shard:()=>{tone(880,.08,'square',.04);setTimeout(()=>tone(1320,.1,'square',.04),60);},
  spring:()=>tone(200,.25,'triangle',.08,700),check:()=>{tone(520,.1,'square',.05);setTimeout(()=>tone(780,.18,'square',.05),90);},
  shoot:()=>tone(520,.1,'square',.03,-300),clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.05),i*110)),
  empty:()=>tone(110,.1,'square',.04)};

/* ---------- input: keyboard + gamepad + touch ---------- */
const ACT=['left','right','up','down','jump','hole','start'];
const KB={},TC={},kmap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',KeyC:'jump',KeyK:'jump',KeyX:'hole',KeyJ:'hole',KeyL:'hole',ShiftLeft:'hole',ShiftRight:'hole',Enter:'start',Escape:'start',KeyP:'start'};
let restartKey=false,anyKey=false;
addEventListener('keydown',e=>{unlock();const a=kmap[e.code];if(a){KB[a]=true;e.preventDefault();}if(e.code==='KeyR')restartKey=true;anyKey=true;});
addEventListener('keyup',e=>{const a=kmap[e.code];if(a){KB[a]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in KB)KB[k]=false;});
document.querySelectorAll('#touch .b').forEach(el=>{const k=el.dataset.k;
  const on=e=>{e.preventDefault();unlock();TC[k]=true;el.classList.add('on');anyKey=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{e.preventDefault();TC[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());});
cv.addEventListener('pointerdown',()=>{unlock();anyKey=true;});
let padAim=null,padAny=false;
function readPad(){const o={};padAim=null;padAny=false;const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of gps){if(!g)continue;const bt=i=>g.buttons[i]&&g.buttons[i].pressed,ax=g.axes;
    if(ax[0]<-.4||bt(14))o.left=1;if(ax[0]>.4||bt(15))o.right=1;if(ax[1]<-.55||bt(12))o.up=1;if(ax[1]>.55||bt(13))o.down=1;
    if(bt(0)||bt(3)||bt(4))o.jump=1;if(bt(2)||bt(1)||bt(5)||bt(7)||bt(6))o.hole=1;if(bt(9)||bt(8))o.start=1;
    if(ax.length>3&&Math.hypot(ax[2],ax[3])>.5)padAim={x:ax[2],y:ax[3]};
    for(let i=0;i<g.buttons.length;i++)if(g.buttons[i].pressed)padAny=true;}
  return o;}
const I={},IP={};
function pollInput(){const p=readPad();for(const a of ACT){IP[a]=I[a];I[a]=!!(KB[a]||TC[a]||p[a]);}}
const pressed=a=>I[a]&&!IP[a];

/* ---------- level construction from hand-made chunks ---------- */
const CW=16,ROWS=11;
const CH={
 start:(s,f,pit)=>{s(2,8,'P');s(8,7,'o');s(10,7,'o');},
 flat:(s)=>{s(9,8,'w');s(5,7,'o');},
 stairs:(s,f)=>{f(4,5,8,8,'#');f(6,7,7,8,'#');f(8,9,6,8,'#');s(12,8,'w');s(8,5,'o');},
 pit3:(s,f,pit)=>{pit(6,8);s(7,6,'o');},
 pit4plat:(s,f,pit)=>{pit(5,9);f(7,8,8,8,'=');s(8,4,'f');},
 spikesRow:(s,f)=>{f(5,9,8,8,'^');f(6,8,7,7,'=');s(12,8,'w');s(7,5,'o');},
 turretHall:(s,f)=>{s(13,8,'t');f(6,6,7,8,'#');s(9,8,'w');s(3,7,'o');},
 crumble:(s,f,pit)=>{pit(3,12);[4,6,8,10].forEach(x=>s(x,9,'c'));s(8,5,'f');s(7,6,'o');},
 mover:(s,f,pit)=>{pit(3,12);s(3,9,'M');s(7,5,'o');},
 springTower:(s,f)=>{s(4,8,'s');f(7,10,3,3,'#');s(8,2,'o');s(13,8,'w');s(12,5,'f');},
 bhGauntlet:(s,f)=>{s(4,8,'w');s(8,8,'w');s(12,8,'w');f(5,7,7,7,'=');f(9,11,5,5,'=');s(10,4,'o');s(6,6,'o');s(8,3,'f');},
 shootGallery:(s,f)=>{s(14,8,'t');s(14,3,'t');f(4,4,7,8,'#');f(8,8,7,8,'#');s(11,8,'w');s(6,8,'o');},
 hazardRun:(s,f)=>{f(4,5,8,8,'^');f(8,9,8,8,'^');f(12,13,8,8,'^');s(7,3,'f');s(2,7,'o');},
 island:(s,f,pit)=>{pit(4,6);pit(9,11);s(7,8,'w');s(8,4,'f');s(7,6,'o');},
 tunnel:(s,f,pit)=>{f(2,13,0,5,'#');pit(7,8);s(4,8,'w');s(11,8,'w');s(7,7,'o');},
 cp:(s)=>{s(8,8,'C');s(5,7,'o');},
 exitc:(s)=>{s(11,8,'E');}
};
const LEVELS=[
 {name:'SECTOR 01 BOOT',mult:1,hue:300,chunks:['start','flat','pit3','stairs','cp','pit4plat','spikesRow','flat','cp','crumble','turretHall','exitc']},
 {name:'SECTOR 02 CORRUPT',mult:1.2,hue:190,chunks:['start','hazardRun','mover','cp','springTower','bhGauntlet','cp','shootGallery','crumble','spikesRow','cp','island','turretHall','tunnel','exitc']},
 {name:'SECTOR 03 NULL',mult:1.4,hue:20,chunks:['start','island','hazardRun','mover','cp','bhGauntlet','shootGallery','crumble','cp','springTower','tunnel','spikesRow','mover','cp','shootGallery','island','hazardRun','bhGauntlet','cp','crumble','turretHall','exitc']}
];
function buildLevel(n){
  const L=LEVELS[n],w=L.chunks.length*CW,g=[];
  for(let y=0;y<ROWS;y++)g.push(new Array(w).fill('.'));
  const lv={w,g,name:L.name,mult:L.mult,hue:L.hue,enemies:[],shards:[],checks:[],movers:[],spawn:{x:40,y:100},exit:null,crumble:{}};
  L.chunks.forEach((nm,ci)=>{
    const ox=ci*CW;
    for(let y=9;y<=10;y++)for(let x=0;x<CW;x++)g[y][ox+x]='#';
    const set=(x,y,c)=>{if(x>=0&&x<CW&&y>=0&&y<ROWS)g[y][ox+x]=c;};
    const fill=(x0,x1,y0,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c);};
    CH[nm](set,fill,(x0,x1)=>fill(x0,x1,9,10,'.'));
  });
  for(let y=0;y<ROWS;y++){g[y][0]='#';g[y][w-1]='#';}
  for(let y=0;y<ROWS;y++)for(let x=0;x<w;x++){const c=g[y][x],px=x*T,py=y*T;
    if(c==='P'){lv.spawn={x:px+4,y:py+T-14};g[y][x]='.';}
    else if(c==='w'){lv.enemies.push({k:'w',x:px+2,y:py+T-10});g[y][x]='.';}
    else if(c==='f'){lv.enemies.push({k:'f',x:px+2,y:py+4});g[y][x]='.';}
    else if(c==='t'){lv.enemies.push({k:'t',x:px+1,y:py+1});g[y][x]='#';}
    else if(c==='o'){lv.shards.push({x:px+4,y:py+4,got:false});g[y][x]='.';}
    else if(c==='C'){lv.checks.push({x:px,y:py,on:false,sx:px+4,sy:py+T-14});g[y][x]='.';}
    else if(c==='M'){lv.movers.push({x:px,y:py,x0:px,x1:px+96,w:48,h:8,dir:1,dx:0,dy:0});g[y][x]='.';}
    else if(c==='E'){lv.exit={x:px,y:py-16,w:16,h:32};g[y][x]='.';}
    else if(c==='c')lv.crumble[x+','+y]={t:-1,gone:0};
  }
  return lv;
}

/* ---------- sprites ---------- */
function spr(rows,pal){const c=document.createElement('canvas'),w=12;c.width=w;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,j)=>{r=r.padEnd(w,'.');for(let i=0;i<w;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}});return c;}
const PAL={h:'#ff5fa8',H:'#c2327a',s:'#f6bf9a',k:'#2a1030',o:'#ff8a1f',O:'#b8470a',b:'#3b2a6b',v:'#7a3cff',c:'#2ef2ff',w:'#ffffff',m:'#ff2e63',V:'#4a1fb0'};
const TOP=["....HHHH....","..hhhhhhH...",".hhhhhhhhH..",".hhhsssshH..","hhhhskssHh..","hhhhssssh...","hHhh.ss.h...","hHh.oooo....","hh.soooos...","h..s.ss.s...","...s.ss.s...","...OOOOOO...","..oooooooo.."];
const LEGS={idle:["...ss..ss...","...ss..ss...","..bbb..bbb.."],runA:["..ss....ss..",".ss......ss.",".bb......bb."],runB:["....ssss....","....s..s....","...bb..bb..."],jump:["...ss.ss....","..ss...s....","..bb...bb..."]};
const HERO={};for(const k in LEGS)HERO[k]=spr(TOP.concat(LEGS[k]),PAL);
const WALK=[spr(["...vvvvvv...","..vvvvvvvv..",".vvwkvvwkvv.",".vvvvvvvvvv.",".vmvvvvvvmv.",".vvvmmmmvvv.",".vvvvvvvvvv.","..vv.vv.vv..",".cc..cc..cc.","c..c....c..c"],PAL),
            spr(["...vvvvvv...","..vvvvvvvv..",".vvwkvvwkvv.",".vvvvvvvvvv.",".vmvvvvvvmv.",".vvvmmmmvvv.",".vvvvvvvvvv.","..vv.vv.vv..","..cc.cc.cc..",".c..c..c..c."],PAL)];
const FLY=[spr(["c..........c","cc..mmmm..cc",".ccmwkmmcc..","..ccmmmcc...","....mm......"].map(r=>r),PAL),
           spr([".c........c.","cc.mmmmmm.cc","ccccwkmmcccc","..cc.mm.cc..","....mm......"],PAL)];

/* ---------- state ---------- */
let state='title',lvIdx=0,lv,P,camX=0,shake=0,glitch=0,gtimer=2,levelTime=0,banner=0,dyingT=0,clearT=0,tNow=0,padWas=false;
const S={deaths:0,kills:0,shards:0,time:0};
let parts=[],bullets=[],holes=[];
const rnd=Math.random,hs=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n);};
const sgn=v=>v>0?1:v<0?-1:0,appr=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);

function startLevel(i){lvIdx=i;lv=buildLevel(i);lv.respawn={x:lv.spawn.x,y:lv.spawn.y};levelTime=0;banner=2.6;
  lv.en=lv.enemies.map(e=>{const o={k:e.k,x:e.x,y:e.y,dead:false,t:rnd()*6,dir:-1,vx:0,vy:0,cd:1+rnd()};
    if(e.k==='w'){o.w=10;o.h=10;}else if(e.k==='f'){o.w=10;o.h=8;o.base=e.y;}else{o.w=14;o.h=14;o.cd=1.2;}return o;});
  state='play';spawnPlayer(true);}
function spawnPlayer(first){const r=lv.respawn;P={x:r.x,y:r.y,w:8,h:14,vx:0,vy:0,face:1,ground:false,coyote:0,buf:0,wall:0,lock:0,riding:null,energy:first?100:100,anim:0,cast:0};
  bullets=[];holes=[];camX=Math.max(0,Math.min(lv.w*T-W,P.x-W/2));state='play';}

/* ---------- collisions ---------- */
function solidTile(tx,ty){if(tx<0||tx>=lv.w)return true;if(ty<0||ty>=ROWS)return false;const c=lv.g[ty][tx];if(c==='#')return true;if(c==='c')return lv.crumble[tx+','+ty].gone<=0;return false;}
const solidPx=(x,y)=>solidTile(Math.floor(x/T),Math.floor(y/T));
function resolveX(o){let hit=false;const ty0=Math.floor(o.y/T),ty1=Math.floor((o.y+o.h-.01)/T),tx0=Math.floor(o.x/T),tx1=Math.floor((o.x+o.w-.01)/T);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)if(solidTile(tx,ty)){
    if(tx*T+T/2>o.x+o.w/2)o.x=tx*T-o.w;else o.x=(tx+1)*T;o.vx=0;hit=true;}
  return hit;}
function resolveY(o,oneway,prevB){o.ground=false;const ty0=Math.floor(o.y/T),ty1=Math.floor((o.y+o.h-.01)/T),tx0=Math.floor(o.x/T),tx1=Math.floor((o.x+o.w-.01)/T);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)if(solidTile(tx,ty)){
    if(ty*T+T/2>o.y+o.h/2){o.y=ty*T-o.h;o.ground=true;if(o.vy>0)o.vy=0;}else{o.y=(ty+1)*T;if(o.vy<0)o.vy=0;}}
  if(oneway&&o.vy>=0&&!o.ground){const by=o.y+o.h,ty=Math.floor(by/T);
    for(let tx=tx0;tx<=tx1;tx++)if(ty>=0&&ty<ROWS&&lv.g[ty][tx]==='='&&prevB<=ty*T+.5&&by>ty*T){o.y=ty*T-o.h;o.ground=true;o.vy=0;}
    for(const m of lv.movers){const by2=o.y+o.h;if(o.x+o.w>m.x&&o.x<m.x+m.w&&prevB<=m.y+1&&by2>=m.y&&by2<=m.y+10){o.y=m.y-o.h;o.ground=true;o.vy=0;o.riding=m;}}}
  return o.ground;}

/* ---------- fx ---------- */
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=rnd()*6.283,s=(.3+rnd())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+rnd()*.5,c:cols[rnd()*cols.length|0],g:0});}}
function bump(g,s){glitch=Math.max(glitch,g);shake=Math.max(shake,s||0);}
function die(){if(state!=='play')return;state='dying';dyingT=.95;S.deaths++;SFX.die();bump(1,6);
  burst(P.x+4,P.y+7,26,['#ff5fa8','#ff8a1f','#f6bf9a','#ffffff'],110);}
function kill(e){e.dead=true;S.kills++;SFX.kill();bump(.55,2);burst(e.x+e.w/2,e.y+e.h/2,18,['#2ef2ff','#7a3cff','#ff2e63','#ffffff'],90);
  if(e.k==='t'){const tx=Math.floor((e.x+2)/T),ty=Math.floor((e.y+2)/T);if(lv.g[ty]&&lv.g[ty][tx]==='#')lv.g[ty][tx]='.';}
  P.energy=Math.min(100,P.energy+10);}

/* ---------- update ---------- */
function updatePlayer(dt){
  const dir=(I.right?1:0)-(I.left?1:0);
  if(P.lock>0)P.lock-=dt;
  if(P.lock<=0){P.vx=appr(P.vx,dir*100,(dir?(P.ground?1000:650):(P.ground?1200:250))*dt);if(dir)P.face=dir;}
  P.wall=0;
  if(!P.ground){if(solidPx(P.x-1,P.y+3)||solidPx(P.x-1,P.y+P.h-3))P.wall=-1;else if(solidPx(P.x+P.w+1,P.y+3)||solidPx(P.x+P.w+1,P.y+P.h-3))P.wall=1;}
  P.vy=Math.min(P.vy+950*dt,270);
  if(P.wall&&P.vy>0&&dir===P.wall)P.vy=Math.min(P.vy,42);
  if(pressed('jump'))P.buf=.12;else P.buf-=dt;
  P.coyote=P.ground?.1:P.coyote-dt;
  if(P.buf>0){
    if(P.coyote>0){P.vy=-310;P.buf=0;P.coyote=0;P.ground=false;SFX.jump();}
    else if(P.wall){P.vx=-P.wall*125;P.vy=-290;P.lock=.17;P.face=-P.wall;P.buf=0;SFX.wall();burst(P.x+(P.wall>0?8:0),P.y+8,5,['#2ef2ff','#fff'],40);}}
  if(!I.jump&&P.vy<-140)P.vy=-140;
  // black hole
  if(P.cast>0)P.cast-=dt;
  P.energy=Math.min(100,P.energy+22*dt);
  if(pressed('hole')){
    if(P.energy>=50&&holes.length<2){
      let ax=P.face,ay=0;
      if(padAim){ax=padAim.x;ay=padAim.y;}
      else if(I.up){ay=-1;ax=dir*1;}else if(I.down){ay=.7;ax=P.face;}
      const m=Math.hypot(ax,ay)||1;ax/=m;ay/=m;
      holes.push({x:P.x+4+ax*6,y:P.y+6+ay*6,vx:ax*150,vy:ay*150,st:'fly',t:0,fly:.42,life:2.6,r:0});
      P.energy-=50;P.cast=.18;SFX.hole();bump(.4,1);
    }else SFX.empty();}
  // move
  if(P.riding)P.x+=P.riding.dx;
  P.x+=P.vx*dt;resolveX(P);
  const prevB=P.y+P.h;P.y+=P.vy*dt;P.riding=null;resolveY(P,true,prevB);
  if(P.ground&&P.vy>=0){
    for(const px of [P.x+1,P.x+P.w-1]){const tx=Math.floor(px/T),ty=Math.floor((P.y+P.h+1)/T);
      if(lv.g[ty]&&lv.g[ty][tx]==='c'){const cs=lv.crumble[tx+','+ty];if(cs.gone<=0&&cs.t<0)cs.t=.4;}}}
  // springs
  const cx=Math.floor((P.x+4)/T),cy=Math.floor((P.y+P.h-2)/T);
  if(lv.g[cy]&&lv.g[cy][cx]==='s'&&P.vy>=0){P.vy=-470;P.ground=false;SFX.spring();bump(.2,1);burst(cx*T+8,cy*T+14,8,['#ff5fa8','#fff'],50);}
  P.anim+=dt*(Math.abs(P.vx)>10?1:0);
  // hazards
  const x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-.01)/T),y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-.01)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(lv.g[ty]&&lv.g[ty][tx]==='^'&&P.y+P.h>ty*T+9)die();
  if(P.y>ROWS*T+30)die();
  for(const c of lv.checks)if(!c.on&&Math.abs(P.x-c.x)<10&&Math.abs(P.y-c.y)<24){c.on=true;lv.respawn={x:c.sx,y:c.sy};SFX.check();bump(.3,0);burst(c.x+8,c.y+8,12,['#ff5fa8','#2ef2ff'],60);}
  for(const s of lv.shards)if(!s.got&&Math.abs(P.x+4-(s.x+4))<9&&Math.abs(P.y+7-(s.y+4))<11){s.got=true;S.shards++;P.energy=Math.min(100,P.energy+25);SFX.shard();burst(s.x+4,s.y+4,6,['#2ef2ff','#fff'],50);}
  if(lv.exit){const e=lv.exit;if(P.x+P.w>e.x&&P.x<e.x+e.w&&P.y+P.h>e.y&&P.y<e.y+e.h){state='clear';clearT=0;SFX.clear();bump(1,0);S.time+=levelTime;}}
}
function updateEnemies(dt){
  for(const e of lv.en){if(e.dead)continue;e.t+=dt;
    if(Math.abs(e.x-P.x)>260)continue;
    if(e.k==='w'){e.vx=e.dir*28*lv.mult;e.vy=Math.min(e.vy+900*dt,250);
      e.x+=e.vx*dt;if(resolveX(e)){e.dir*=-1;}
      e.y+=e.vy*dt;resolveY(e,false,0);if(e.ground&&e.vy>=0)e.vy=0;
      if(e.ground){const fx=e.dir>0?e.x+e.w+2:e.x-2;if(!solidPx(fx,e.y+e.h+2))e.dir*=-1;}}
    else if(e.k==='f'){const dx=P.x-e.x;if(Math.abs(dx)<130)e.x+=sgn(dx)*26*lv.mult*dt;e.y=e.base+Math.sin(e.t*2.4)*12;
      if(Math.abs(dx)<130)e.base+=sgn(P.y-e.base)*8*dt;}
    else{const dx=P.x-e.x,dy=P.y-e.y;
      if(Math.abs(dx)<180&&Math.abs(dy)<100){e.cd-=dt;if(e.cd<=0){e.cd=2/Math.sqrt(lv.mult);const sx=e.x+7,sy=e.y+7,a=Math.atan2(P.y+7-sy,P.x+4-sx);
        bullets.push({x:sx,y:sy,vx:Math.cos(a)*82,vy:Math.sin(a)*82,l:4});SFX.shoot();}}else e.cd=Math.max(e.cd,.8);}
    if(P.x+P.w>e.x+1&&P.x<e.x+e.w-1&&P.y+P.h>e.y+1&&P.y<e.y+e.h-1)die();}
}
function updateBullets(dt){
  for(const q of bullets){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(solidPx(q.x,q.y))q.l=0;
    if(Math.abs(q.x-(P.x+4))<4.5&&Math.abs(q.y-(P.y+7))<7)die();}
  bullets=bullets.filter(q=>q.l>0);
}
function updateHoles(dt){
  for(const h of holes){h.t+=dt;
    if(h.st==='fly'){h.x+=h.vx*dt;h.y+=h.vy*dt;h.fly-=dt;if(rnd()<.6)parts.push({x:h.x,y:h.y,vx:0,vy:0,l:.25,c:'#ff5fa8',g:0});
      if(solidPx(h.x,h.y)){h.x-=h.vx*dt;h.y-=h.vy*dt;h.fly=0;}
      if(h.fly<=0){h.st='open';h.t=0;h.vx=h.vy=0;bump(.3,2);}}
    else{const life=h.life,k=h.t<.3?h.t/.3:(h.t>life-.45?Math.max(0,(life-h.t)/.45):1);h.r=52*k;
      for(const e of lv.en){if(e.dead)continue;const ex=e.x+e.w/2,ey=e.y+e.h/2,dx=h.x-ex,dy=h.y-ey,d=Math.hypot(dx,dy);
        if(d<h.r&&e.k!=='t'){const sp=(26+90*(1-d/h.r))*dt;e.x+=dx/(d||1)*sp;e.y+=dy/(d||1)*sp;if(e.k==='f')e.base+=dy/(d||1)*sp;}
        if(d<(e.k==='t'?26:13)&&k>.5)kill(e);}
      for(const q of bullets){const dx=h.x-q.x,dy=h.y-q.y,d=Math.hypot(dx,dy);if(d<h.r){q.x+=dx/(d||1)*80*dt;q.y+=dy/(d||1)*80*dt;}if(d<12){q.l=0;burst(q.x,q.y,4,['#ff5fa8'],30);}}
      if(rnd()<.8){const a=rnd()*6.283,rr=h.r*(.7+rnd()*.4);parts.push({x:h.x+Math.cos(a)*rr,y:h.y+Math.sin(a)*rr*.8,vx:-Math.cos(a)*rr*2.2-Math.sin(a)*20,vy:-Math.sin(a)*rr*2.2+Math.cos(a)*20,l:.35,c:rnd()<.5?'#ff8a1f':'#ff5fa8',g:0});}
      if(h.t>=life)h.dead=true;}}
  holes=holes.filter(h=>!h.dead);
}
function updateWorld(dt){
  for(const m of lv.movers){const px=m.x;m.x+=m.dir*38*lv.mult*dt;if(m.x>m.x1){m.x=m.x1;m.dir=-1;}if(m.x<m.x0){m.x=m.x0;m.dir=1;}m.dx=m.x-px;}
  for(const k in lv.crumble){const c=lv.crumble[k];if(c.t>0){c.t-=dt;if(c.t<=0){c.t=-1;c.gone=2.4;burst(+k.split(',')[0]*T+8,+k.split(',')[1]*T+8,6,['#b8470a','#ff8a1f'],40);}}else if(c.gone>0)c.gone-=dt;}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
}
function step(dt){
  tNow+=dt;
  gtimer-=dt;if(gtimer<0){gtimer=2+rnd()*4;glitch=Math.max(glitch,.2+rnd()*.2);}
  glitch=Math.max(0,glitch-dt*1.6);shake=Math.max(0,shake-dt*14);
  if(state==='play'){levelTime+=dt;if(banner>0)banner-=dt;updateWorld(dt);updatePlayer(dt);if(state==='play'){updateEnemies(dt);updateBullets(dt);}updateHoles(dt);
    const tx=P.x-W/2+P.face*26;camX+=(tx-camX)*Math.min(1,dt*6);}
  else if(state==='dying'){dyingT-=dt;updateWorld(dt);updateHoles(dt);if(dyingT<=0)spawnPlayer();}
  else if(state==='clear'){clearT+=dt;updateWorld(dt);}

}

      b.fillStyle=`hsl(${h+10*l},${45-l*8}%,${9+l*4}%)`;b.fillRect(Math.round(x-((cx*sp)%cw)),base-hh,cw-1,hh+30);

function drawTiles(cx){

    txt(lvIdx<LEVELS.length-1?'SECTOR CLEARED':'SIGNAL RESTORED',W/2,44,'#ff8a1f',12,'center');
    txt('TIME   '+levelTime.toFixed(1)+'S',60,72,'#fff');txt('DEATHS '+S.deaths,60,86,'#ff5fa8');txt('KILLS  '+S.kills,60,100,'#7a3cff');txt('SHARDS '+S.shards,60,114,'#2ef2ff');
    if(clearT>.6&&Math.floor(tNow*2)%2===0)txt(lvIdx<LEVELS.length-1?'JUMP = NEXT SECTOR':'JUMP = TITLE',W/2,130,'#fff',8,'center');}
}
function present(){
  ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  const sx=shake>0?Math.round((rnd()-.5)*shake):0,sy=shake>0?Math.round((rnd()-.5)*shake):0;
  ctx.drawImage(buf,sx,sy);
  if(glitch>.04){
    const n=2+Math.floor(glitch*9);
    for(let i=0;i<n;i++){const y=rnd()*H|0,hgt=2+(rnd()*14*(.4+glitch)|0),off=Math.round((rnd()-.5)*46*glitch);ctx.drawImage(buf,0,y,W,Math.min(hgt,H-y),off,y,W,Math.min(hgt,H-y));}
    if(glitch>.2){const d=Math.round(1+glitch*4);
      for(const [col,dx] of [['#ff0040',d],['#00e0ff',-d]]){tc.globalCompositeOperation='source-over';tc.clearRect(0,0,W,H);tc.drawImage(buf,0,0);tc.globalCompositeOperation='multiply';tc.fillStyle=col;tc.fillRect(0,0,W,H);
        ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(.6,glitch*.7);ctx.drawImage(tmp,dx,0);}
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
    if(glitch>.5){ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,rnd()*H|0,W,2);}
  }
}
function render(){
  b.setTransform(1,0,0,1,0,0);b.globalAlpha=1;b.imageSmoothingEnabled=false;
  if(state==='title'){drawTitle();present();return;}
  const cx=Math.round(camX);
  b.fillStyle='#000';b.fillRect(0,0,W,H);
  b.save();b.translate(0,OY);drawBG(cx);b.restore();
  b.save();b.translate(-cx,OY);drawTiles(cx);drawEntities();drawHoles();drawPlayer();
  for(const p of parts){b.fillStyle=p.c;b.fillRect(Math.round(p.x),Math.round(p.y),2,2);}
  b.restore();
  drawHUD();drawOverlay();present();
}

/* ---------- main loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  pollInput();
  const padEdge=padAny&&!padWas;padWas=padAny;const any=anyKey||padEdge||pressed('jump')||pressed('start');
  if(state==='title'){tNow+=dt;glitch=Math.max(0,glitch-dt*1.6);gtimer-=dt;if(gtimer<0){gtimer=1.5+rnd()*2;glitch=.3;}
    if(any){S.deaths=S.kills=S.shards=S.time=0;startLevel(0);}}
  else{
    if(pressed('start')&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';
    if(restartKey&&(state==='play'||state==='pause'||state==='dying')){startLevel(lvIdx);}
    if(state==='clear'&&clearT>.6&&(pressed('jump')||pressed('start')||padEdge)){
      if(lvIdx<LEVELS.length-1)startLevel(lvIdx+1);else{state='title';lv=buildLevel(0);}}
    if(state!=='pause'){acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;}}
  }
  anyKey=false;restartKey=false;
  render();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
lv=buildLevel(0);
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"');
requestAnimationFrame(frame);
})();
</script>
