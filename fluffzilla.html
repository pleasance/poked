<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fluffzilla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one centered pixel canvas framed like an arcade screen, a short controls legend under it, and a touch pad on coarse pointers. Single dark look by choice (neon arcade). */
:root{--bg:#17102b;--panel:#241846;--line:#3a2a6b;--ink:#fff1f8;--dim:#a99bd6;--hot:#ff6fae;--mint:#7ff0c8;--px:"Press Start 2P",ui-monospace,Menlo,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--px);font-size:8px;line-height:1.8;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100%;box-sizing:border-box}
#c{display:block;image-rendering:pixelated;background:#000;box-shadow:0 0 0 4px var(--line),0 0 0 8px #0c0720,0 0 48px #ff6fae40;touch-action:none;margin-top:8px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;max-width:760px;color:var(--dim);text-align:center}
.legend b{color:var(--mint);font-weight:400}
#pad{display:none;width:100%;max-width:420px;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){#pad{display:flex}}
.grp{display:flex;gap:10px}
#pad button,.snd{font-family:var(--px);font-size:10px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-bottom-width:6px;min-width:54px;height:54px;padding:0 8px;touch-action:none;cursor:pointer}
#pad button:active,#pad button.on{background:var(--hot);border-color:#ffb3d4;transform:translateY(2px)}
.snd{height:auto;min-width:0;padding:6px 10px;font-size:8px;border-width:2px;border-bottom-width:4px}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
</style>

<canvas id="c" aria-label="Fluffzilla game screen" tabindex="0"></canvas>
<div id="pad">
  <div class="grp"><button data-k="left" aria-label="Left">&#9664;</button><button data-k="right" aria-label="Right">&#9654;</button></div>
  <div class="grp"><button data-k="up" aria-label="Jump or climb">&#9650;</button><button data-k="punch">PAW</button><button data-k="special">&#9733;</button></div>
</div>
<div class="legend">
  <span><b>&larr; &rarr;</b> MOVE</span><span><b>&uarr;</b> JUMP / CLIMB WALLS</span><span><b>Z</b> PUNCH</span><span><b>X</b> SPECIAL</span><span><b>M</b> SOUND</span><span><b>PAD</b> STICK MOVE, A JUMP/CLIMB, X PUNCH, Y SPECIAL</span>
</div>
<button class="snd" id="snd" type="button">SOUND: ON</button>

<script>
"use strict";
const W=384,H=216,GY=192,CS=12,WW=1152;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const g=buf.getContext('2d');g.imageSmoothingEnabled=false;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round((n>>16&255)*f)),gg=Math.min(255,Math.round((n>>8&255)*f)),b=Math.min(255,Math.round((n&255)*f));return'#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1)}

/* ---------- resize to integer pixel scale ---------- */
function fit(){
  const availW=Math.min(window.innerWidth-48,1200), availH=window.innerHeight-170;
  let s=Math.min(availW/W,Math.max(availH,W*.5*H/W)/H);
  s=s>=1?Math.floor(s):s; s=Math.max(.6,s);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
}
addEventListener('resize',fit);fit();

/* ---------- audio (tiny chiptune) ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide,delay){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  gn.gain.setValueAtTime(v||.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v){
  if(muted)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),dt=b.getChannelData(0);
  for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),gn=a.createGain();s.buffer=b;gn.gain.value=v||.08;s.connect(gn);gn.connect(a.destination);s.start();
}
const SFX={
  swing:()=>tone(300,.07,'square',.03,-160),
  hit:()=>{tone(180,.09,'square',.06,-90);noise(.06,.05)},
  crumble:()=>noise(.1,.05),
  jump:()=>tone(260,.14,'square',.04,380),
  land:()=>noise(.07,.05),
  hurt:()=>{tone(400,.25,'sawtooth',.07,-330);noise(.15,.06)},
  boom:()=>{noise(.5,.14);tone(90,.5,'sawtooth',.09,-60)},
  pick:()=>{tone(660,.07,'square',.05);tone(990,.1,'square',.05,0,.07)},
  special:()=>{tone(120,.5,'sawtooth',.09,500);noise(.4,.1)},
  shoot:()=>tone(520,.06,'square',.02,-300),
  kill:()=>{tone(500,.1,'square',.05,300);tone(700,.1,'square',.05,0,.08)},
  card:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.07))},
  die:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.08,0,i*.18))},
  glitch:()=>{tone(RI(80,900),.05,'square',.04);tone(RI(80,900),.05,'sawtooth',.03,0,.04)}
};
let mstep=0,mTimer=null;
const LEAD=[0,4,7,12,9,7,4,7, 2,5,9,14,12,9,5,9, 0,4,7,12,14,12,9,7, 5,9,12,9,7,4,2,4];
const BASS=[0,0,5,5,7,7,5,2];
function startMusic(){
  if(mTimer)return;
  mTimer=setInterval(()=>{
    if(muted||document.hidden||!AC)return;
    const n=LEAD[mstep%LEAD.length],f=Math.pow(2,n/12)*262;
    tone(f*(Math.random()<.02?1.5:1),.12,'square',.012);
    if(mstep%4===0)tone(Math.pow(2,BASS[(mstep>>2)%BASS.length]/12)*65,.4,'triangle',.05);
    mstep++;
  },140);
}
document.getElementById('snd').addEventListener('click',()=>{muted=!muted;document.getElementById('snd').textContent='SOUND: '+(muted?'OFF':'ON');ac();cv.focus()});

/* ---------- sprites ---------- */
const PAL={
  cat:{o:'#3b1f4f',b:'#ffab5e',w:'#ffe6c2',p:'#ff8fb8',e:'#2a1538'},
  bun:{o:'#3b1f4f',b:'#f7f2ff',w:'#ffc9e3',p:'#ff9fc8',e:'#2a1538'},
  sol:{g:'#5fa85a',s:'#ffd2b0',k:'#2a1538'}
};
const HEAD=[".obbbbbbbbbbbbo.",".obbeebbbbeebbo.",".obpeebbbbeepbo.",".obbbbbbppbbbbo.","..obbbbbbbbbbo..","...oooooooooo..."];
const BODY=["..obbbbbbbbbbo..",".obbbwwwwwwbbbo.",".obbbwwwwwwbbbo.",".obbbwwwwwwbbbo.","..obbbbbbbbbbo.."];
const LEGA=["..obbo....obbo..","..oooo....oooo.."],LEGB=["...obbo..obbo...","...oooo..oooo..."];
const CATEARS=["................","................","................","..oo........oo..",".obbo......obbo.",".obpbooooooobpbo"];
const BUNEARS=["...oo......oo...","..obbo....obbo..","..obpo....obpo..","..obpo....obpo..","..obbo....obbo..",".obbbbbbbbbbbbo."];
function rowsFor(ch,leg){const head=HEAD.slice(1);return (ch==='cat'?CATEARS:BUNEARS).concat(head,BODY,leg)}
function mk(rows,pal,flip){
  const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const k=r[i];if(k==='.')continue;x.fillStyle=pal[k];x.fillRect(flip?r.length-1-i:i,y,1,1)}});return c}
const SP={};
['cat','bun'].forEach(ch=>{SP[ch]={};[['a',LEGA],['b',LEGB]].forEach(([n,leg])=>{SP[ch][n]=[mk(rowsFor(ch,leg),PAL[ch],false),mk(rowsFor(ch,leg),PAL[ch],true)]})});
const SOL=["..gggg..",".gggggg.","..skks..","..ssss..",".ggggggg",".gggggg.",".gg..gg.",".kk..kk."];
SP.sol=[mk(SOL,PAL.sol,false),mk(SOL,PAL.sol,true)];
const HEART=[".xx.xx.","xxxxxxx","xxxxxxx",".xxxxx.","..xxx..","...x..."];
function mkHeart(col,hi){const c=document.createElement('canvas');c.width=7;c.height=6;const x=c.getContext('2d');HEART.forEach((r,y)=>{for(let i=0;i<7;i++)if(r[i]==='x'){x.fillStyle=col;x.fillRect(i,y,1,1)}});if(hi){x.fillStyle=hi;x.fillRect(1,1,1,1)}return c}
const HF=mkHeart('#ff4f8f','#ffd0e4'),HE=mkHeart('#4a3a7a');
const HH=(()=>{const c=document.createElement('canvas');c.width=7;c.height=6;const x=c.getContext('2d');x.drawImage(HE,0,0);x.save();x.beginPath();x.rect(0,0,4,6);x.clip();x.drawImage(HF,0,0);x.restore();return c})();

/* ---------- input ---------- */
const K={},J={};
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'punch',KeyJ:'punch',KeyX:'special',KeyK:'special',ShiftLeft:'special'};
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const a=KEYS[e.code];
  if(a||e.code==='Enter'){e.preventDefault()}
  if(a){K[a]=true;if(!e.repeat)J[a]=true}
  if(!e.repeat)menuKey(e.code);
  ac();startMusic();
});
addEventListener('keyup',e=>{const a=KEYS[e.code];if(a)K[a]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false});
document.querySelectorAll('#pad button').forEach(b=>{
  const a=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();K[a]=true;J[a]=true;b.classList.add('on');ac();startMusic()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{K[a]=false;b.classList.remove('on')}));
});

/* ---------- game state ---------- */
let S='title',sel=0,hs=0,t=0,cam=0,shake=0,glitch=0,banner=0,clearT=0,deadT=0,lvl=1,spawnT=60,mod=null,offers=[],psel=0;
try{hs=+localStorage.getItem('fz_hs')||0}catch(e){}
let P=null,B=[],E=[],BU=[],PK=[],PT=[],TX=[],RG=[];
const CH=[
  {id:'cat',name:'MOCHI',kind:'CAT',hp:7,spd:1.22,jump:1,stomp:false,perk:'FAST + CLIMBS QUICK',snack:'FISH'},
  {id:'bun',name:'BISCUIT',kind:'BUNNY',hp:9,spd:1,jump:1.3,stomp:true,perk:'BIG BOUNCE + STOMP',snack:'CARROT'}
];
const COLS=['#ffb8a8','#a8f0d8','#ffe8a0','#a8d0ff','#e0b8ff','#ffc0e0'];
const MODS=[
  {n:'NIGHT SHIFT',night:1,m:1.25},
  {n:'GLITCH STORM',storm:1,m:1.5},
  {n:'LUNCH RUSH',rush:1,m:1},
  {n:'ARMY ALERT',alert:1,m:1.5}
];
const UPS=[
  {id:'paws',n:'BIG PAWS',d:'PUNCH DAMAGE +1',max:4,f:p=>p.dmg++},
  {id:'reach',n:'LONG REACH',d:'PUNCH REACH +8',max:3,f:p=>p.reach+=8},
  {id:'zoom',n:'ZOOMIES',d:'MOVE SPEED +15%',max:3,f:p=>p.spd*=1.15},
  {id:'fluff',n:'EXTRA FLUFF',d:'+2 MAX HP AND FULL HEAL',max:5,f:p=>{p.max+=2;p.hp=p.max}},
  {id:'life',n:'NINE LIVES',d:'REVIVE ONCE WHEN DOWN',max:2,f:p=>p.lives++},
  {id:'boing',n:'SPROING',d:'DOUBLE JUMP AND HIGHER',max:1,f:p=>{p.jump*=1.1;p.dbl=true}},
  {id:'stomp',n:'THUNDER BUTT',d:'LANDINGS MAKE SHOCKWAVES',max:1,f:p=>p.stomp=true},
  {id:'purr',n:'PURR SHIELD',d:'BLOCKS 1 HIT EACH LEVEL',max:1,f:p=>{p.shieldMax=1;p.shield=1}},
  {id:'chaos',n:'CHAOS FUR',d:'25% CRIT x3. MORE GLITCH',max:2,f:p=>{p.crit+=.25;p.glitchy+=.1}},
  {id:'mag',n:'SNACK MAGNET',d:'PULLS SNACKS, HEALS +1',max:2,f:p=>{p.magnet+=40;p.snack++}},
  {id:'quick',n:'QUICK SPECIAL',d:'SPECIAL RECHARGES 35% FASTER',max:2,f:p=>p.spMax*=.65},
  {id:'hangry',n:'HANGRY',d:'ENEMIES DROP SNACKS',max:1,f:p=>p.hangry=true},
  {id:'heart',n:'GLITCH HEART',d:'+4 MAX HP. SCREEN GOES WILD',max:1,f:p=>{p.max+=4;p.hp+=4;p.glitchy+=.3}}
];

function newRun(i){
  const c=CH[i];lvl=1;
  P={ch:c,x:60,y:GY,vx:0,vy:0,face:1,hp:c.hp,max:c.hp,spd:c.spd,jump:c.jump,dmg:1,reach:10,crit:0,dbl:false,jumps:0,stomp:c.stomp,
     magnet:0,snack:2,shield:0,shieldMax:0,lives:0,spCd:0,spMax:480,punchT:0,cool:0,inv:0,climb:false,glitchy:0,hangry:false,
     score:0,kills:0,bld:0,ups:{},anim:0,fall:0,done:true};
  startLevel();
}
function startLevel(){
  mod=(lvl>1&&Math.random()<.6)?pick(MODS):null;
  genLevel();E=[];BU=[];PK=[];PT=[];TX=[];RG=[];
  P.x=60;P.y=GY;P.vx=0;P.vy=0;P.climb=false;P.shield=P.shieldMax;P.inv=60;
  spawnT=120;banner=170;clearT=0;cam=0;S='play';
}
function genLevel(){
  const n=Math.min(3+(lvl>>1),6),slot=(WW-260)/n,hp=2+Math.floor(lvl/3);B=[];
  for(let i=0;i<n;i++){
    const w=RI(5,7),h=Math.min(RI(5,8)+(lvl>>1),11);
    const bx=Math.round(150+i*slot+RI(0,Math.max(0,slot-w*CS-34)));
    const col=pick(COLS),nm=mod&&mod.night,c2=nm?shade(col,.62):col;
    const b={x:bx,w,h,col:c2,dk:shade(c2,.72),roof:shade(c2,.55),cells:new Uint8Array(w*h).fill(1),hp:new Uint8Array(w*h).fill(hp),
      mhp:hp,item:new Uint8Array(w*h),lit:new Uint8Array(w*h),alive:w*h,total:w*h,done:false,seed:RI(1,999)};
    for(let k=0;k<w*h;k++){b.lit[k]=Math.random()<(nm?.7:.4)?1:0;if(Math.random()<(mod&&mod.rush?.16:.07))b.item[k]=1}
    B.push(b);
  }
}
const solid=(x0,y0,x1,y1)=>{
  for(const b of B){
    if(b.done)continue;const bx0=b.x,bx1=b.x+b.w*CS,by0=GY-b.h*CS;
    if(x1<=bx0||x0>=bx1||y1<=by0||y0>=GY)continue;
    const c0=Math.max(0,Math.floor((x0-bx0)/CS)),c1=Math.min(b.w-1,Math.floor((x1-1e-6-bx0)/CS));
    const r0=Math.max(0,Math.floor((y0-by0)/CS)),r1=Math.min(b.h-1,Math.floor((y1-1e-6-by0)/CS));
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(b.cells[r*b.w+c])return true;
  }
  return false;
};
function stepX(o,d,hw,hh){const s=Math.sign(d);let n=Math.abs(d);while(n>0){const st=Math.min(1,n)*s;o.x+=st;if(solid(o.x-hw,o.y-hh,o.x+hw,o.y)){o.x-=st;return true}n-=1}return false}
function stepY(o,d,hw,hh){const s=Math.sign(d);let n=Math.abs(d);while(n>0){const st=Math.min(1,n)*s;o.y+=st;if(solid(o.x-hw,o.y-hh,o.x+hw,o.y)){o.y-=st;return true}n-=1}return false}

/* ---------- effects ---------- */
function debris(x,y,col,n){for(let i=0;i<n;i++)PT.push({x:x+R(-4,4),y:y+R(-4,4),vx:R(-2,2),vy:R(-3.5,-.5),c:Math.random()<.3?shade(col,.7):col,s:RI(2,4),life:RI(30,60)})}
function spark(x,y,c,n){for(let i=0;i<n;i++)PT.push({x,y,vx:R(-3,3),vy:R(-3,1),c,s:2,life:RI(10,22),g:.1})}
function pop(x,y,s,c){TX.push({x,y,s,c:c||'#fff',life:50})}
function ring(x,y,r,c){RG.push({x,y,r:6,max:r,c})}
function addScore(n){P.score+=Math.round(n*(mod?mod.m:1))}

/* ---------- buildings ---------- */
function hitCell(b,c,r,d){
  const i=r*b.w+c;if(!b.cells[i]||b.done)return false;
  const cx=b.x+c*CS+CS/2,cy=GY-(b.h-r)*CS+CS/2;
  b.hp[i]=Math.max(0,b.hp[i]-d);
  if(b.hp[i]>0){spark(cx,cy,'#fff',2);return true}
  b.cells[i]=0;b.alive--;debris(cx,cy,b.col,4);addScore(5*lvl);
  if(b.item[i]){PK.push({x:cx,y:cy,vy:-2.5})}
  if(Math.random()<.35)SFX.crumble();
  if(b.alive<=b.total*.12)collapse(b);
  return true;
}
function collapse(b){
  if(b.done)return;b.done=true;
  for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++)if(b.cells[r*b.w+c]){debris(b.x+c*CS+6,GY-(b.h-r)*CS+6,b.col,2)}
  b.cells.fill(0);b.alive=0;P.bld++;
  const pts=100*lvl;addScore(pts);pop(b.x+b.w*CS/2,GY-b.h*CS-4,'CRASH! +'+Math.round(pts*(mod?mod.m:1)),'#ffe27a');
  shake=Math.max(shake,12);glitch=1;SFX.boom();
  if(B.every(x=>x.done)){clearT=1}
}
function cellsIn(b,x0,y0,x1,y1,fn){
  if(b.done)return;const bx1=b.x+b.w*CS,by0=GY-b.h*CS;
  if(x1<=b.x||x0>=bx1||y1<=by0||y0>=GY)return;
  const c0=Math.max(0,Math.floor((x0-b.x)/CS)),c1=Math.min(b.w-1,Math.floor((x1-1e-6-b.x)/CS));
  const r0=Math.max(0,Math.floor((y0-by0)/CS)),r1=Math.min(b.h-1,Math.floor((y1-1e-6-by0)/CS));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)fn(c,r);
}

/* ---------- player ---------- */
const HW=11,HH_=34;
function hurt(n){
  if(P.inv>0||S!=='play')return;
  if(P.shield>0){P.shield--;P.inv=45;pop(P.x,P.y-44,'BLOCKED','#7ff0c8');SFX.pick();return}
  P.hp-=n;P.inv=65;shake=7;glitch=1;SFX.hurt();rumble(220,.8);spark(P.x,P.y-18,'#ff6fae',10);
  if(P.hp<=0){
    if(P.lives>0){P.lives--;P.hp=Math.ceil(P.max/2);P.inv=140;pop(P.x,P.y-44,'NINE LIVES!','#ffe27a');glitch=1;ring(P.x,P.y-16,70,'#ffe27a')}
    else{S='dead';deadT=0;SFX.die();try{if(P.score>hs){hs=P.score;localStorage.setItem('fz_hs',String(hs))}}catch(e){}}
  }
}
function dmgEnemy(e,d){
  e.hp-=d;e.flash=6;spark(e.x,e.y-8,'#fff',4);
  if(e.hp<=0&&!e.dead){
    e.dead=true;P.kills++;addScore(e.t==='sol'?20:e.t==='heli'?60:90);SFX.kill();debris(e.x,e.y-8,e.t==='sol'?'#5fa85a':'#8a8fb0',8);
    pop(e.x,e.y-20,'+'+(e.t==='sol'?20:e.t==='heli'?60:90),'#fff');
    if(P.hangry&&Math.random()<.5)PK.push({x:e.x,y:e.y-10,vy:-2});
  }
}
function blast(x,y,r,d){
  for(const b of B)cellsIn(b,x-r,y-r,x+r,y+r,(c,rr)=>{const cx=b.x+c*CS+6,cy=GY-(b.h-rr)*CS+6;if(Math.hypot(cx-x,cy-y)<=r)hitCell(b,c,rr,d)});
  for(const e of E)if(Math.hypot(e.x-x,e.y-8-y)<r+14)dmgEnemy(e,d+1);
  BU=BU.filter(b=>Math.hypot(b.x-x,b.y-y)>r);
}
function special(){
  P.spCd=P.spMax;ring(P.x,P.y-16,90,'#ffffff');ring(P.x,P.y-16,60,'#ff6fae');blast(P.x,P.y-16,84,3+Math.floor(P.dmg/2));
  shake=Math.max(shake,9);glitch=1;SFX.special();rumble(300,.6);
}
function doPunch(){
  const e=P.face>0?P.x+HW:P.x-HW;
  const xa=P.face>0?e-2:e-P.reach,xb=P.face>0?e+P.reach:e+2,ya=P.y-HH_-4,yb=P.y-4;
  const crit=Math.random()<P.crit,d=P.dmg*(crit?3:1);let hit=0;
  for(const b of B)cellsIn(b,xa,ya,xb,yb,(c,r)=>{if(hitCell(b,c,r,d))hit++});
  for(const en of E)if(!en.dead&&Math.abs(en.x-(xa+xb)/2)<en.w/2+(xb-xa)/2&&en.y-en.h<yb&&en.y>ya)dmgEnemy(en,d),hit++;
  if(hit){shake=Math.max(shake,crit?5:2);glitch=Math.min(1,glitch+(crit?.5:.08));SFX.hit();if(crit)pop(P.x+P.face*24,P.y-40,'CRIT!','#ff6fae')}
}
function land(v){
  if(P.fall>6.2&&P.stomp){ring(P.x,P.y,46,'#ffe27a');blast(P.x,P.y-6,42,2);shake=Math.max(shake,6);glitch=Math.min(1,glitch+.4);SFX.boom()}
  else if(P.fall>4){SFX.land();shake=Math.max(shake,2);for(let i=0;i<5;i++)PT.push({x:P.x+R(-10,10),y:P.y-2,vx:R(-1,1),vy:R(-1.5,-.3),c:'#ffffff80',s:2,life:18,g:.04})}
  P.fall=0;P.jumps=0;
}
function updPlayer(){
  const p=P;p.anim++;
  const dir=(K.right?1:0)-(K.left?1:0);
  if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;if(p.spCd>0)p.spCd--;
  const grounded=()=>p.y>=GY||solid(p.x-HW,p.y,p.x+HW,p.y+1);
  const probe=d=>d>0?solid(p.x+HW,p.y-HH_+3,p.x+HW+2,p.y-3):solid(p.x-HW-2,p.y-HH_+3,p.x-HW,p.y-3);
  if(p.climb){
    p.vx=0;p.vy=0;
    if(!probe(p.face)){p.climb=false;p.vy=-3.2;p.vx=p.face*1.7}
    else{
      const sp=1.5*p.spd*(p.ch.id==='cat'?1.12:1);
      if(K.up)stepY(p,-sp,HW,HH_);else if(K.down){stepY(p,sp,HW,HH_);if(grounded()||p.y>=GY){p.y=Math.min(p.y,GY);if(p.y>=GY)p.climb=false}}
      if(dir===-p.face){p.climb=false;p.vx=dir*1.6}
      if(J.jump){p.climb=false;p.vx=-p.face*3.4;p.vy=-5.8*p.jump;p.face=-p.face;p.jumps=1;SFX.jump()}
    }
  }
  if(!p.climb){
    const g0=grounded();
    p.vx+=(dir*2.1*p.spd-p.vx)*(g0?.4:.18);
    if(dir)p.face=dir;
    if(K.up&&dir&&probe(dir)){p.climb=true;p.face=dir;p.vx=0;p.vy=0}
    else if(J.jump||J.up){
      if(g0){p.vy=-6.7*p.jump;p.jumps=1;SFX.jump()}
      else if(p.dbl&&p.jumps<2){p.vy=-6.1*p.jump;p.jumps=2;SFX.jump();spark(p.x,p.y,'#fff',6)}
    }
    if(p.vy<-3&&!K.jump&&!K.up)p.vy*=.8;
    p.vy=Math.min(p.vy+.36,9);if(p.vy>0)p.fall=Math.max(p.fall,p.vy);
    if(stepX(p,p.vx,HW,HH_))p.vx=0;
    p.x=clamp(p.x,HW,WW-HW);
    const vy0=p.vy;let blocked=stepY(p,p.vy,HW,HH_);
    if(p.y>=GY){p.y=GY;blocked=true}
    if(blocked){if(vy0>0)land(vy0);p.vy=0}
  }
  if((J.punch||K.punch)&&p.cool<=0){p.punchT=11;p.cool=p.spd>1.2?13:15;p.done=false;SFX.swing()}
  if(p.punchT>0){p.punchT--;if(p.punchT===7&&!p.done){p.done=true;doPunch()}}
  if(J.special&&p.spCd<=0)special();
}

/* ---------- enemies, bullets, pickups ---------- */
function shoot(x,y,tx,ty,sp,d,gv){
  const a=Math.atan2(ty-y,tx-x);BU.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0,d,r:2});SFX.shoot();
}
function spawnEnemy(){
  const left=Math.random()<.5,x=clamp(left?cam-16:cam+W+16,20,WW-20),r=Math.random();
  if(lvl>=4&&r<.15)E.push({t:'tank',x,y:GY,w:36,h:18,hp:5+Math.floor(lvl/2),fire:90,face:1,ph:R(0,6)});
  else if(lvl>=2&&r<.4)E.push({t:'heli',x,y:50,w:34,h:16,hp:3+Math.floor(lvl/4),fire:80,face:1,ph:R(0,6)});
  else E.push({t:'sol',x,y:GY,w:14,h:18,hp:1+Math.floor(lvl/5),fire:RI(40,100),face:1,ph:R(0,6)});
}
function updEnemies(){
  for(const e of E){
    if(e.flash>0)e.flash--;const dx=P.x-e.x,d=Math.abs(dx);e.face=Math.sign(dx)||1;e.fire--;
    if(e.t==='sol'){
      if(d>130)stepX(e,e.face*.6,7,16);else if(d<70)stepX(e,-e.face*.5,7,16);
      if(e.fire<=0&&d<230){e.fire=Math.max(45,RI(75,135)-lvl*4);shoot(e.x+e.face*8,e.y-12,P.x,P.y-18,2.1,1)}
    }else if(e.t==='heli'){
      e.x+=(P.x+Math.sin(t/50+e.ph)*100-e.x)*.012;e.y+=(clamp(P.y-44+Math.sin(t/30+e.ph)*8,34,GY-40)-e.y)*.03;
      if(e.fire<=0&&Math.abs(dx)<150){e.fire=Math.max(55,RI(85,140)-lvl*3);shoot(e.x,e.y+8,P.x,P.y-18,2,1)}
    }else{
      if(d>170)stepX(e,e.face*.35,16,14);
      if(e.fire<=0&&d<320){
        e.fire=Math.max(100,170-lvl*4);const T=60,gv=.1,tx=P.x,ty=P.y-18,sx=e.x+e.face*14,sy=e.y-16;
        BU.push({x:sx,y:sy,vx:(tx-sx)/T,vy:((ty-sy)-.5*gv*T*T)/T,g:gv,d:2,r:4});SFX.shoot();
      }
    }
  }
  E=E.filter(e=>!e.dead&&e.x>-60&&e.x<WW+60);
  if(S==='play'&&clearT===0){
    spawnT--;const cap=Math.min(3+(lvl>>1),8)+(mod&&mod.alert?2:0);
    if(spawnT<=0&&E.length<cap){spawnEnemy();spawnT=Math.max(60,230-lvl*14)*(mod&&mod.alert?.6:1)*R(.7,1.3)}
  }
}
function updBullets(){
  for(const b of BU){
    b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;
    if(solid(b.x-1,b.y-1,b.x+1,b.y+1)||b.y>GY||b.x<-50||b.x>WW+50){b.dead=true;spark(b.x,b.y,'#ffe27a',3);continue}
    if(Math.abs(b.x-P.x)<HW+b.r&&b.y>P.y-HH_&&b.y<P.y){b.dead=true;hurt(b.d)}
  }
  BU=BU.filter(b=>!b.dead);
}
function updPickups(){
  for(const k of PK){
    const dx=P.x-k.x,dy=(P.y-16)-k.y,dd=Math.hypot(dx,dy);
    if(P.magnet&&dd<20+P.magnet){k.x+=dx/dd*2.2;k.y+=dy/dd*2.2;k.vy=0}
    else{k.vy+=.3;const ny=k.y+k.vy;if(ny>=GY-3||solid(k.x-3,ny-3,k.x+3,ny+3)){k.vy=0}else k.y=ny}
    if(Math.abs(dx)<HW+6&&k.y>P.y-HH_-4&&k.y<P.y+4){k.got=true;P.hp=Math.min(P.max,P.hp+P.snack);addScore(10);pop(k.x,k.y-8,'+'+P.snack+' HP','#7ff0c8');SFX.pick()}
  }
  PK=PK.filter(k=>!k.got);
}
function updFx(){
  for(const q of PT){q.vy+=q.g==null?.25:q.g;q.x+=q.vx;q.y+=q.vy;if(q.y>GY-1&&q.g==null){q.y=GY-1;q.vy*=-.3;q.vx*=.6}q.life--}
  PT=PT.filter(q=>q.life>0);if(PT.length>420)PT.splice(0,PT.length-420);
  for(const x of TX){x.y-=.4;x.life--}TX=TX.filter(x=>x.life>0);
  for(const r of RG){r.r+=5;}RG=RG.filter(r=>r.r<r.max);
}

/* ---------- flow ---------- */
function offerCards(){
  const pool=UPS.filter(u=>(P.ups[u.id]||0)<u.max);
  for(let i=pool.length-1;i>0;i--){const j=RI(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}
  offers=pool.slice(0,3);psel=0;
}
function choose(i){
  const u=offers[i];if(!u)return;u.f(P);P.ups[u.id]=(P.ups[u.id]||0)+1;SFX.card();lvl++;startLevel();
}
function menuKey(code){
  if(S==='title'){
    if(code==='ArrowLeft'||code==='KeyA')sel=0;
    else if(code==='ArrowRight'||code==='KeyD')sel=1;
    else if(code==='Enter'||code==='Space'){newRun(sel);SFX.card()}
  }else if(S==='pick'){
    if(code==='ArrowLeft'||code==='KeyA')psel=(psel+2)%3;
    else if(code==='ArrowRight'||code==='KeyD')psel=(psel+1)%3;
    else if(code==='Digit1')choose(0);else if(code==='Digit2')choose(1);else if(code==='Digit3')choose(2);
    else if(code==='Enter'||code==='Space')choose(psel);
  }else if(S==='dead'){
    if((code==='Enter'||code==='Space')&&deadT>50){S='title'}
  }
  if(code==='KeyM')document.getElementById('snd').click();
}
cv.addEventListener('pointerdown',e=>{
  ac();startMusic();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
  if(S==='title'){sel=x<W/2?0:1;newRun(sel);SFX.card()}
  else if(S==='pick'){choose(Math.max(0,Math.min(2,Math.floor((x-10)/124))))}
  else if(S==='dead'&&deadT>50)S='title';
});
/* ---------- gamepad ---------- */
let padPrev={},padGo=false,padMsg=0;
addEventListener('gamepadconnected',()=>{padMsg=220});
function getPad(){try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const x of l)if(x&&x.connected)return x}catch(e){}return null}
function rumble(d,m){try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const x of l){const v=x&&x.vibrationActuator;if(v&&v.playEffect)v.playEffect('dual-rumble',{duration:d,strongMagnitude:m,weakMagnitude:m})}}catch(e){}}
function pollPad(){
  const gp=getPad();
  if(!gp){for(const a in padPrev)if(padPrev[a])K[a]=false;padPrev={};padGo=false;return}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const cur={left:ax<-.4||b(14),right:ax>.4||b(15),up:ay<-.5||b(12)||b(0),down:ay>.5||b(13),jump:b(0)||b(1),punch:b(2)||b(5)||b(7),special:b(3)||b(4)||b(6)};
  const go=b(0)||b(9);
  for(const a in cur)if(cur[a]!==!!padPrev[a]){
    K[a]=cur[a];if(cur[a]){J[a]=true;if(S!=='play'){if(a==='left')menuKey('ArrowLeft');else if(a==='right')menuKey('ArrowRight')}}
  }
  if(go&&!padGo&&S!=='play'){menuKey('Enter');for(const k in J)J[k]=false}
  padPrev=cur;padGo=go;
}
function drawPadMsg(){if(padMsg>0){padMsg--;txt('GAMEPAD CONNECTED',W/2,H-26,'#7ff0c8','center')}}
function update(){
  t++;pollPad();
  if(S==='play'){
    updPlayer();updEnemies();updBullets();updPickups();updFx();
    if(banner>0)banner--;
    if(clearT>0){clearT++;if(clearT>90){addScore(100*lvl);P.hp=Math.min(P.max,P.hp+2);offerCards();S='pick';SFX.card()}}
    const want=clamp(P.x-W/2,0,WW-W);cam+=(want-cam)*.1;
  }else if(S==='dead'){deadT++;updFx()}
  else updFx();
  shake*=.86;if(shake<.2)shake=0;glitch*=.93;
  for(const k in J)J[k]=false;
}

/* ---------- rendering ---------- */
function txt(s,x,y,col,al,size,sh){
  g.font=(size||8)+'px "Press Start 2P",monospace';g.textBaseline='top';g.textAlign=al||'left';
  if(sh!==false){g.fillStyle='#1a0c33';g.fillText(s,x+1,y+1)}
  g.fillStyle=col||'#fff';g.fillText(s,x,y);
}
function wrap(s,n){const out=[];let l='';for(const w of s.split(' ')){if((l+' '+w).trim().length>n){out.push(l);l=w}else l=(l+' '+w).trim()}if(l)out.push(l);return out}
function disc(cx,cy,r,col){g.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(cx-w,cy+y,w*2+1,1)}}
const SKYD=['#3d2a7a','#4a3086','#5d3a94','#7544a0','#8e4eab','#a95bb4','#c46ab8','#de7bb8','#f08fb9','#ffa5bb','#ffbcc0'];
const SKYN=['#080620','#0c0828','#120a34','#190d40','#21104c','#2a1458','#331964','#3d1d70','#47227a','#502783','#592c8b'];
const STARS=Array.from({length:60},()=>({x:RI(0,W),y:RI(0,130),p:RI(0,100)}));
const CLOUDS=Array.from({length:4},(_,i)=>({x:i*110,y:RI(14,70),v:R(.04,.12),w:RI(28,46)}));
function mkLayer(par,mn,mx,col){const arr=[];let x=0;const tot=WW*par+W+160;while(x<tot){const w=RI(24,56);arr.push({x,w,h:RI(mn,mx)});x+=w+RI(0,8)}return{par,arr,col,coln:shade(col,.5)}}
const LAYERS=[mkLayer(.22,40,110,'#7a56b8'),mkLayer(.5,30,90,'#5e3f9c')];
function sky(){
  const night=mod&&mod.night,pal=night?SKYN:SKYD,bh=Math.ceil(GY/pal.length);
  pal.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*bh,W,bh)});
  g.fillStyle=pal[pal.length-1];g.fillRect(0,GY-2,W,H-GY+2);
  if(night||S==='title'&&false){g.fillStyle='#fff';for(const s of STARS)if((t+s.p)%100>6)g.fillRect(s.x,s.y,1,1)}
  night?disc(300,48,16,'#fff7c8'):disc(310,62,22,'#ffe9a6');
  if(night){disc(306,44,13,SKYN[4])}
  g.fillStyle=night?'#ffffff18':'#ffffff55';
  for(const c of CLOUDS){const x=Math.floor((c.x+t*c.v)%(W+80))-40;g.fillRect(x,c.y,c.w,6);g.fillRect(x+6,c.y-5,c.w-14,6);g.fillRect(x+c.w*.3,c.y-9,c.w*.3,5)}
}
function skyline(c0){
  const night=mod&&mod.night;
  for(const L of LAYERS){
    const ox=-c0*L.par;g.fillStyle=night?L.coln:L.col;
    for(const b of L.arr){const bx=Math.round(b.x+ox);if(bx>W||bx+b.w<0)continue;g.fillRect(bx,GY-b.h,b.w,b.h)}
    g.fillStyle=night?'#ffe27a66':'#ffffff22';
    for(const b of L.arr){const bx=Math.round(b.x+ox);if(bx>W||bx+b.w<0)continue;
      for(let yy=GY-b.h+6;yy<GY-6;yy+=9)for(let xx=bx+4;xx<bx+b.w-4;xx+=8)if((((b.x+xx-bx)*7+yy*13)%5+5)%5<2)g.fillRect(xx,yy,2,3)}
  }
}
function ground(x0,x1){
  g.fillStyle='#3b2a74';g.fillRect(x0,GY,x1-x0,H-GY);
  g.fillStyle='#7ee0b0';g.fillRect(x0,GY,x1-x0,3);g.fillStyle='#5bc596';g.fillRect(x0,GY+3,x1-x0,1);
  g.fillStyle='#2f2062';for(let x=Math.floor(x0/24)*24;x<x1;x+=24)g.fillRect(x,GY+14,12,2);
  g.fillStyle='#4a3790';for(let x=Math.floor(x0/16)*16;x<x1;x+=16)g.fillRect(x+4,GY+6,3,2);
}
function drawB(b){
  const by0=GY-b.h*CS;b.wd=b.wd||shade(b.col,.45);
  if(b.done){
    for(let x=b.x,k=0;x<b.x+b.w*CS;x+=4,k++){const h=3+((k*7+b.seed)%6);g.fillStyle=k%3?b.dk:b.col;g.fillRect(x,GY-h,4,h)}
    g.fillStyle=b.roof;g.fillRect(b.x+6,GY-9,4,3);g.fillRect(b.x+b.w*CS-14,GY-8,5,2);return;
  }
  for(let r=0;r<b.h;r++)for(let c=0;c<b.w;c++){
    const i=r*b.w+c;if(!b.cells[i])continue;const x=b.x+c*CS,y=by0+r*CS;
    g.fillStyle=b.col;g.fillRect(x,y,CS,CS);
    g.fillStyle=b.dk;g.fillRect(x+CS-2,y,2,CS);g.fillRect(x,y+CS-1,CS-2,1);
    if(r===0||!b.cells[i-b.w]){g.fillStyle=b.roof;g.fillRect(x,y,CS,3)}
    const lit=b.lit[i];g.fillStyle=lit?'#fff3a6':b.wd;g.fillRect(x+3,y+4,6,6);
    if(lit){g.fillStyle='#fffbe0';g.fillRect(x+3,y+4,2,2)}
    if(b.item[i]){
      if(P.ch.id==='cat'){g.fillStyle='#7fd3ff';g.fillRect(x+3,y+6,4,3);g.fillRect(x+7,y+5,2,5);g.fillStyle='#1a0c33';g.fillRect(x+4,y+7,1,1)}
      else{g.fillStyle='#ff9a3e';g.fillRect(x+3,y+6,5,3);g.fillStyle='#6fd66f';g.fillRect(x+8,y+5,2,5)}
    }
    if(b.hp[i]<b.mhp){g.fillStyle=b.roof;g.fillRect(x+2,y+2,1,5);g.fillRect(x+3,y+6,3,1);g.fillRect(x+7,y+1,1,3)}
  }
}

    g.fillStyle='#3b3f58';g.fillRect(x-16,y-7,32,6);g.fillStyle='#6f7aa8';g.fillRect(x-12,y-14,24,7);g.fillRect(x-6,y-19,12,5);

function drawPickup(k){

}
function drawPlayer(){
  const p=P;if(p.inv>0&&S==='play'&&(t>>2)%2)return;
  const fl=p.face>0?0:1,mv=Math.abs(p.vx)>.6&&p.y>=GY||p.climb&&(K.up||K.down),step=Math.floor(p.anim/5)%2;
  const sp=SP[p.ch.id][mv&&step?'b':'a'][fl],x=Math.round(p.x-16),y=Math.round(p.y-36-(mv&&step?1:0));
  const pal=PAL[p.ch.id],bk=-p.face;
  if(p.ch.id==='cat'){
    const pts=[0,1,2,3].map(i=>({x:p.x+bk*(12+i*3),y:p.y-14-i*4+Math.sin(t/6+i)*2}));
    g.fillStyle=pal.o;pts.forEach(q=>g.fillRect(Math.round(q.x)-3,Math.round(q.y)-3,6,6));
    g.fillStyle=pal.b;pts.forEach(q=>g.fillRect(Math.round(q.x)-2,Math.round(q.y)-2,4,4));
  }else{g.fillStyle=pal.o;g.fillRect(Math.round(p.x+bk*17)-5,Math.round(p.y-18),10,10);g.fillStyle='#fff';g.fillRect(Math.round(p.x+bk*17)-4,Math.round(p.y-17),8,8)}
  g.drawImage(sp,x,y,32,36);
  if(p.climb){
    const o=(Math.floor(p.y/6)%2)*5,fx=Math.round(p.x+p.face*(HW-3));
    g.fillStyle=pal.o;g.fillRect(fx-3,Math.round(p.y-28+o),7,7);g.fillRect(fx-3,Math.round(p.y-14-o),7,7);
    g.fillStyle=pal.w;g.fillRect(fx-2,Math.round(p.y-27+o),5,5);g.fillRect(fx-2,Math.round(p.y-13-o),5,5);
  }
  if(p.punchT>0){
    const ext=Math.sin((11-p.punchT)/11*Math.PI)*(HW+p.reach),fx=p.x+p.face*(HW-6+ext),fy=Math.round(p.y-22);
    const ax=Math.min(p.x,fx),aw=Math.abs(fx-p.x);
    g.fillStyle=pal.o;g.fillRect(Math.round(ax),fy+1,Math.round(aw),8);g.fillRect(Math.round(fx)-6,fy-2,12,12);
    g.fillStyle=pal.b;g.fillRect(Math.round(ax),fy+2,Math.round(aw),6);g.fillRect(Math.round(fx)-5,fy-1,10,10);
    g.fillStyle=pal.p;g.fillRect(Math.round(fx)-2+p.face*2,fy+2,4,4);
  }
  if(p.shield>0){g.strokeStyle='#7ff0c8';g.lineWidth=1;g.setLineDash([4,4]);g.lineDashOffset=-t/2;g.strokeRect(Math.round(p.x)-19.5,Math.round(p.y)-45.5,39,47);g.setLineDash([])}
}
function renderWorld(){
  g.save();sky();skyline(cam);
  const sx=Math.round(R(-1,1)*shake),sy=Math.round(R(-1,1)*shake);
  g.translate(-Math.round(cam)+sx,sy);
  ground(Math.floor(cam)-8,Math.floor(cam)+W+8);
  for(const b of B)drawB(b);
  for(const k of PK)drawPickup(k);
  for(const e of E)drawEnemy(e);
  for(const b of BU){const s=b.r>3?6:3;g.fillStyle='#1a0c33';g.fillRect(Math.round(b.x)-s/2-1,Math.round(b.y)-s/2-1,s+2,s+2);g.fillStyle=b.r>3?'#ff8a5e':'#ffe27a';g.fillRect(Math.round(b.x)-s/2,Math.round(b.y)-s/2,s,s)}
  if(P)drawPlayer();
  for(const q of PT){g.fillStyle=q.c;g.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s)}
  for(const r of RG){g.globalAlpha=1-r.r/r.max;g.strokeStyle=r.c;g.lineWidth=3;g.beginPath();g.arc(Math.round(r.x),Math.round(r.y),r.r,0,Math.PI*2);g.stroke();g.globalAlpha=1}
  for(const x of TX)txt(x.s,Math.round(x.x),Math.round(x.y),x.c,'center',8);

  if(mod&&mod.night){g.fillStyle='#0a0420';g.globalAlpha=.18;g.fillRect(0,0,W,H);g.globalAlpha=1}
}
function hud(){

  for(let i=0;i<n;i++){const v=P.hp-i*2;g.drawImage(v>=2||(v===1&&P.max%2&&i===n-1)?HF:v===1?HH:HE,6+i*9,6)}

  txt(String(P.score).padStart(6,'0'),W-6,6,'#fff','right');
  txt('LV '+lvl+'  SMASHED '+B.filter(b=>b.done).length+'/'+B.length,W/2,6,'#fff','center');
  if(mod)txt(mod.n,W/2,17,'#ff9ec9','center');
  const rdy=P.spCd<=0;
  txt('X',6,H-12,rdy&&(t>>3)%2?'#fff':'#7ff0c8');
  g.fillStyle='#1a0c33';g.fillRect(18,H-12,62,8);g.fillStyle=rdy?'#7ff0c8':'#ff6fae';g.fillRect(19,H-11,Math.round(60*(1-P.spCd/P.spMax)),6);

  }
  if(clearT>0&&S==='play'){txt('ALL SMASHED!',W/2+(Math.random()<.2?RI(-3,3):0),82,'#7ff0c8','center',16)}
}
function glitchTitle(s,x,y,size){

  txt(s,x-2+j,y,'#4df0ff','center',size,false);txt(s,x+2-j,y,'#ff4fa0','center',size,false);txt(s,x,y,'#fff1f8','center',size);

function renderTitle(){
  g.save();sky();skyline(t*.4);ground(0,W);g.restore();

function renderPick(){

function renderDead(){

  if(deadT<20)return;

const SCAN=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.13)';for(let y=1;y<H;y+=2)x.fillRect(0,y,W,1);return c})();
function present(){
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(buf,0,0);
  const amb=.02+(P?P.glitchy:0)+(mod&&mod.storm?.25:0)+(S==='title'?.05:0),gl=Math.min(1,glitch+amb);
  if(Math.random()<gl*.6+amb*.4){
    const n=1+Math.floor(Math.random()*gl*6);
    for(let i=0;i<n;i++){const sy=RI(0,H-6),sh=RI(2,Math.round(8+gl*24)),dx=Math.round(R(-1,1)*(5+gl*24));ctx.drawImage(buf,0,sy,W,sh,dx,sy,W,sh)}
  }
  if(gl>.2){const o=Math.round(1+gl*3);ctx.globalAlpha=Math.min(.4,gl*.4);ctx.drawImage(buf,-o,0);ctx.drawImage(buf,o,0);ctx.globalAlpha=1}
  if(Math.random()<gl*.4){ctx.globalAlpha=.6;ctx.fillStyle=pick(['#ff2e93','#2ee6ff','#fff23a','#7dff6a']);ctx.fillRect(RI(0,W-30),RI(0,H),RI(4,50),RI(1,3));ctx.globalAlpha=1}
  if(gl>.4){for(let i=0;i<3;i++){const w=RI(8,32),h=RI(4,16);ctx.drawImage(cv,RI(0,W-w),RI(0,H-h),w,h,RI(0,W-w),RI(0,H-h),w,h)}}

}
function render(){
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
  if(S==='title'){renderTitle();drawPadMsg();return}
  renderWorld();hud();
  if(S==='pick')renderPick();else if(S==='dead')renderDead();
  drawPadMsg();
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  try{
    acc+=Math.min(100,now-last);last=now;let n=0;
    while(acc>=16.667&&n<4){update();acc-=16.667;n++}
    if(Math.random()<.003&&S!=='pick')glitch=Math.max(glitch,.45);
    render();present();
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
try{if(document.fonts)document.fonts.load('8px "Press Start 2P"')}catch(e){}
requestAnimationFrame(frame);
window.__fz={get S(){return S},get P(){return P},get B(){return B},newRun,update,K,J};
