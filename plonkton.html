<style>

  color:var(--cream);

  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}

.sub{margin:0;color:var(--mint);font-size:23px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:10px 12px}
.tab,.btn{

  background:var(--deep);color:var(--cream);border:3px solid var(--sky);box-shadow:0 4px 0 var(--sky);

.btn{font-size:11px;padding:8px 12px}

.tab:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

}

}

<main class="wrap">
  <header class="top">
    <h1>Plonkton</h1>
    <p class="sub">a tiny glitchy pond that sings when you poke it</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Ponds"></nav>

  <div class="stage">
    <canvas id="cv" aria-label="Music pond. Click, drag or press keys to make sound."></canvas>
    <div class="crt"></div>
    <div class="wake" id="wake">tap the pond or press any key to wake it up</div>
  </div>

  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="bar">
    <button class="btn" id="scaleBtn" type="button">Scale: Candy</button>
    <label class="ctl" for="glitch">Glitch <input id="glitch" type="range" min="0" max="100" value="35"></label>
    <button class="btn" id="muteBtn" type="button">Sound: on</button>
    <button class="btn" id="clearBtn" type="button">Reset pond</button>
  </div>

  <p class="foot"><kbd>1</kbd>–<kbd>7</kbd> pick a pond · <kbd>↑</kbd> <kbd>↓</kbd> change scale · <kbd>Esc</kbd> reset pond · three keyboard rows are three octaves</p>
</main>

  update(dt) {
    if (!touched) { this.demo -= dt; if (this.demo <= 0) { this.demo = 1.1; const p = this.pads[Math.floor(Math.random() * 8)]; this.drop(p.x + R(-4, 4), 4); } }

  draw() {

/* ---------- mode 2: Squiggle ---------- */
const DLO = -5, DHI = 14;
const TYPES_Q = ['square', 'triangle', 'sawtooth', 'sine'];
const squig = {
  name: 'Squiggle', hint: 'Drag to draw a line. A fish swims along it and sings at every height. Keys draw a wiggly line: the <kbd>A</kbd> row is the middle, <kbd>Q</kbd> row is higher, <kbd>Z</kbd> row is lower.',
  lines: [], cur: null, curId: null, n: 0,
  enter() { if (!this.lines.length) this.seed(); },
  seed() { this.lines = []; this.add(this.wave(78, 22, .045, 0, 14, W - 14), 0); },
  reset() { this.cur = null; this.seed(); },
  wave(yc, amp, f, ph, x0, x1) { const pts = []; for (let x = x0; x <= x1; x += 3) pts.push([x, clamp(yc + Math.sin(x * f + ph) * amp, 6, H - 10)]); return pts; },
  add(pts, forceI) {
    const len = [0]; for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const i = forceI !== undefined ? forceI : this.n++;
    this.lines.push({ pts, len, total: len[len.length - 1], c: PAL[i % PAL.length], t: TYPES_Q[i % 4], s: 0, dir: 1, acc: 0 });
    if (this.lines.length > 4) this.lines.shift();
  },
  at(L, s) {
    const p = L.pts, l = L.len; let i = 1;
    while (i < p.length - 1 && l[i] < s) i++;
    const seg = l[i] - l[i - 1] || 1, f = clamp((s - l[i - 1]) / seg, 0, 1);
    return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * f, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * f];
  },
  down(id, x, y) { this.cur = { pts: [[x, y]] }; this.curId = id; },
  move(id, x, y) {
    if (!this.cur || id !== this.curId) return;
    const q = this.cur.pts[this.cur.pts.length - 1];
    if (Math.hypot(x - q[0], y - q[1]) >= 2.5 && this.cur.pts.length < 400) this.cur.pts.push([clamp(x, 0, W), clamp(y, 0, H)]);
  },
  up(id) {
    if (!this.cur || id !== this.curId) return;
    if (this.cur.pts.length >= 4) this.add(this.cur.pts);
    this.cur = null; this.curId = null;
  },
  key(col, row, down) {
    if (!down) return;
    const deg = col + Ls() * row;
    const yc = H - 12 - (deg - DLO) / (DHI - DLO) * (H - 24);
    const left = Math.random() < .5, x0 = left ? 10 : 30, x1 = left ? W - 30 : W - 10;
    this.add(this.wave(yc, R(4, 11), R(.03, .09), R(0, 6), x0, x1));
  },
  update(dt) {
    for (const L of this.lines) {
      const spd = 64, ds = L.dir * spd * dt;
      L.s += ds; L.acc += Math.abs(ds);
      if (L.s >= L.total) { L.s = L.total; L.dir = -1; } else if (L.s <= 0) { L.s = 0; L.dir = 1; }
      if (L.acc >= 12) {
        L.acc -= 12;
        const [x, y] = this.at(L, L.s);
        const deg = Math.round(DLO + (H - 12 - y) / (H - 24) * (DHI - DLO));
        note(freq(deg), { type: L.t, dur: L.t === 'sine' ? .3 : .2, vol: L.t === 'sawtooth' ? .12 : .2 });
        spark(x, y, L.c, 3);
      }
    }
  },
  draw() {
    const line = (pts, c) => {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i], st = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1])));
        for (let k = 0; k <= st; k++) rect(a[0] + (b[0] - a[0]) * k / st, a[1] + (b[1] - a[1]) * k / st, 2, 2, c);
      }
    };
    for (const L of this.lines) line(L.pts, L.c);
    if (this.cur) line(this.cur.pts, C.cream);
    for (const L of this.lines) {
      const [x, y] = this.at(L, L.s);
      spr(FISH, x - 4, y - 2, { o: L.c, e: C.ink, c: C.cheek }, L.dir < 0);
    }
  }
};

/* ---------- mode 3: Ripples ---------- */
const rip = {
  name: 'Ripples', hint: 'Click or drag to make ripples. Every jellyfish a ring touches plays its note, so where you click makes the tune. Keys make rings across the pond.',
  rings: [], jel: [], demo: .3, lx: 0, ly: 0, down_: false,

  },

      const f = g.r / g.max, c = f < .45 ? C.cream : f < .75 ? C.sky : C.grape;

/* ---------- mode 4: Choir ---------- */
const TYPES_C = ['square', 'triangle', 'sawtooth', 'triangle', 'square', 'sine', 'sawtooth', 'triangle'];
const choir = {
  name: 'Choir', hint: 'Hold anywhere in a column to sing, then slide up or down to bend the pitch. Hold keys <kbd>A</kbd>–<kbd>K</kbd> to sing, <kbd>Q</kbd> row sings higher, <kbd>Z</kbd> row lower.',
  S: [], ptr: new Map(), demoT: 1,

  down(id, x, y) { const i = this.idx(x); this.ptr.set(id, { i }); this.start(this.S[i], 'p' + id, 0, this.bend(y)); },
  move(id, x, y) {

/* ---------- mode 5: Crabs (drum machine) ---------- */
const CRAB_A = ["o.......o", "oo.ooo.oo", ".ooooooo.", "ooeoooeoo", ".ooooooo.", ".o.o.o.o."];
const CRAB_B = ["oo.....oo", "o.ooooo.o", ".ooooooo.", "ooeoooeoo", ".ooooooo.", "o.o.o.o.o"];
const ROWC = [C.pink, C.sun, C.mint, C.sky];
const crabs = {
  name: 'Crabs', theme: 1,
  hint: 'Click or drag across the shells to wake crabs up. Each row is a drum: kick, snare, hat, clap. Click the sand to change the tempo. Keys <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> play the drums live, the other rows tune them higher or lower.',
  g: [], sq: [], lv: [0, 0, 0, 0], step: 7, acc: 0, bpm: 118, paint: true, lastCell: null, pid: null, tempoId: null,
  enter() { if (!this.g.length) this.reset(); },
  reset() {

    this.step = 7; this.acc = 0; this.bpm = 118;
  },
  cell(x, y) {

  },
  setTempo(x) { this.bpm = Math.round(70 + clamp(x / W, 0, 1) * 110); },
  setCell(k, on) {
    this.g[k.r][k.c] = on ? 1 : 0;
    if (on) { drum(k.r, 1); this.sq[k.r][k.c] = 1; spark(22 + k.c * 28, 24 + k.r * 31, ROWC[k.r], 4); }
  },
  down(id, x, y) {
    if (y >= 136) { this.tempoId = id; this.setTempo(x); return; }
    const k = this.cell(x, y); if (!k) return;
    this.paint = !this.g[k.r][k.c]; this.pid = id; this.lastCell = k.r * 8 + k.c; this.setCell(k, this.paint);
  },
  move(id, x, y) {
    if (id === this.tempoId) { this.setTempo(x); return; }
    if (id !== this.pid) return;
    const k = this.cell(x, y); if (!k) return;
    const key = k.r * 8 + k.c; if (key === this.lastCell) return;
    this.lastCell = key; this.setCell(k, this.paint);
  },
  up(id) { if (id === this.tempoId) this.tempoId = null; if (id === this.pid) { this.pid = null; this.lastCell = null; } },
  key(col, row, down) {
    if (!down) return;

    spark(R(20, W - 20), 24 + r * 31, ROWC[r], 5);
  },
  update(dt) {

        drum(r, 1); this.sq[r][this.step] = 1; spark(22 + this.step * 28, 24 + r * 31, ROWC[r], 3);
      }
    }
    for (const row of this.sq) for (let c = 0; c < 8; c++) row[c] = Math.max(0, row[c] - dt * 4);
    for (let r = 0; r < 4; r++) this.lv[r] = Math.max(0, this.lv[r] - dt * 4);
  },
  draw() {
    rect(0, 138, W, 22, '#e0b97e');
    for (let x = 0; x < W; x += 2) rect(x, 138 + (x % 4 ? 0 : 1), 1, 1, '#f0d29a');
    for (let x = 5; x < W; x += 17) rect(x, 146 + (x * 7) % 9, 2, 1, '#c79c63');
    const px = 8 + (this.step + this.acc / (60 / this.bpm / 2)) * 28;

    const tx = (this.bpm - 70) / 110 * W;
    rect(tx - 3, 143, 7, 1, C.ink); rect(tx - 2, 144, 5, 1, C.ink); rect(tx - 1, 145, 3, 1, C.ink); rect(tx, 146, 1, 1, C.ink);
    ctx.globalAlpha = .18; rect(8 + this.step * 28, 10, 28, 124, C.cream); ctx.globalAlpha = 1;
    for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) {

      rect(cx - 11, cy - 9, 22, 1, bc); rect(cx - 11, cy + 8, 22, 1, bc); rect(cx - 11, cy - 9, 1, 18, bc); rect(cx + 10, cy - 9, 1, 18, bc);
      if (on) spr(hit ? CRAB_B : CRAB_A, cx - 9, cy - 6 + (hit ? -1 : 0), { o: hit ? C.cream : ROWC[r], e: C.ink }, false, 2);

    }
  }
};

/* ---------- mode 6: Glim (fireflies and bells) ---------- */

const degToY = d => clamp(H - 12 - (d - DLO) / (DHI - DLO) * (H - 24), 8, H - 16);
const glim = {
  name: 'Glim', theme: 2,
  hint: 'Hold and drag to call the fireflies. When two of them meet they ring a glass bell, higher up the pond rings higher. Keys release a new firefly and ring its note.',
  ff: [], ptr: new Map(), links: [], gcd: 0,
  enter() { if (!this.ff.length) this.reset(); },
  reset() { this.ff = []; this.links = []; for (let i = 0; i < 12; i++) this.ff.push(this.mk(R(20, W - 20), R(20, H - 30), false, i)); },

  key(col, row, down) {
    if (!down) return;
    const deg = col + Ls() * row, x = 14 + col / 9 * (W - 28), y = degToY(deg);
    if (this.ff.length >= 22) { const i = this.ff.findIndex(f => f.wisp); if (i >= 0) this.ff.splice(i, 1); }
    this.ff.push(this.mk(x, y, true, col));
    bell(freq(deg), .22);
    spark(x, y, C.cream, 5);
  },
  update(dt) {
    const P = [...this.ptr.values()];
    this.gcd -= dt;
    for (let i = this.ff.length - 1; i >= 0; i--) {
      const f = this.ff[i];
      f.cd -= dt; f.fl = Math.max(0, f.fl - dt * 2.5);
      f.vx += R(-1, 1) * 60 * dt; f.vy += R(-1, 1) * 60 * dt;
      for (const p of P) {
        const dx = p.x - f.x, dy = p.y - f.y, d = Math.hypot(dx, dy) || 1;
        if (d < 90) { const k = 1 - d / 90; f.vx += (dx / d * 140 - dy / d * 60) * k * dt; f.vy += (dy / d * 140 + dx / d * 60) * k * dt; }
      }
      f.vx *= 1 - 1.2 * dt; f.vy *= 1 - 1.2 * dt;
      const sp = Math.hypot(f.vx, f.vy); if (sp > 55) { f.vx *= 55 / sp; f.vy *= 55 / sp; }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 6) { f.x = 6; f.vx = Math.abs(f.vx); } else if (f.x > W - 6) { f.x = W - 6; f.vx = -Math.abs(f.vx); }
      if (f.y < 6) { f.y = 6; f.vy = Math.abs(f.vy); } else if (f.y > H - 14) { f.y = H - 14; f.vy = -Math.abs(f.vy); }
      if (f.wisp) { f.life -= dt; if (f.life <= 0) this.ff.splice(i, 1); }
    }
    for (let i = 0; i < this.ff.length; i++) for (let j = i + 1; j < this.ff.length; j++) {
      const a = this.ff[i], b = this.ff[j];
      if (a.cd > 0 || b.cd > 0 || this.gcd > 0) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < 14) {
        const my = (a.y + b.y) / 2;
        bell(freq(yToDeg(my)), .2);
        a.cd = b.cd = .9; a.fl = b.fl = 1; this.gcd = .06;
        this.links.push({ a, b, l: .3 });
        spark((a.x + b.x) / 2, my, C.cream, 3);
      }
    }
    for (let i = this.links.length - 1; i >= 0; i--) { this.links[i].l -= dt; if (this.links[i].l <= 0) this.links.splice(i, 1); }
  },
  draw() {
    for (const p of this.ptr.values()) ring(p.x, p.y, 10 + Math.sin(T * 8) * 2, '#3a5f9a');
    for (const k of this.links) {
      const dx = k.b.x - k.a.x, dy = k.b.y - k.a.y, st = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 2));
      for (let s = 0; s <= st; s += 2) rect(k.a.x + dx * s / st, k.a.y + dy * s / st, 1, 1, C.cream);
    }
    for (const f of this.ff) {
      if (f.wisp && f.life < 2 && Math.floor(f.life * 10) % 2) continue;
      const pulse = .5 + .5 * Math.sin(T * 3 + f.ph);
      ctx.globalAlpha = .25 + .35 * pulse; rect(f.x - 3, f.y, 7, 1, f.c); rect(f.x, f.y - 3, 1, 7, f.c); ctx.globalAlpha = 1;
      if (f.fl > .3) { rect(f.x - 5, f.y, 11, 1, f.c); rect(f.x, f.y - 5, 1, 11, f.c); }
      rect(f.x - 1, f.y - 1, 3, 3, f.c); rect(f.x, f.y, 1, 1, C.cream);
    }
  }
};

/* ---------- mode 7: Blub (bubbles) ---------- */
const blub = {
  name: 'Blub', theme: 3, n: 0, demo: .3,
  hint: 'Hold the water to blow a bubble: the bigger it gets, the lower it sings. Let go and it floats up and pops at the top. Tap a bubble to pop it, and bubbles that bump merge into one big blorp. Hold keys to blow bubbles from the bottom.',
  bs: [], inf: new Map(),
  enter() { if (!this.bs.length) this.seed(); },
  leave() { this.stopAll(); },
  seed() { this.bs = []; for (let i = 0; i < 5; i++) this.bs.push(this.mk(R(20, W - 20), R(30, H - 30), R(5, 16), 'rise')); },
  reset() { this.stopAll(); this.seed(); },
  stopAll() { for (const b of this.bs) if (b.v) { b.v.stop(); b.v = null; } this.inf.clear(); },
  mk(x, y, r, st) { return { x, y, r, st, ph: R(0, 6), c: PAL[this.n++ % PAL.length], v: null }; },
  r2d(r) { return clamp(Math.round(12 - (r - 3) / 23 * 14), -2, 12); },
  kill(b, sparks) {
    if (b.v) { b.v.stop(); b.v = null; }
    const i = this.bs.indexOf(b); if (i >= 0) this.bs.splice(i, 1);
    if (sparks) spark(b.x, b.y, b.c, 8);
    for (const [k, v] of this.inf) if (v === b) this.inf.delete(k);
  },
  popB(b) { pop(freq(this.r2d(b.r))); this.kill(b, true); },
  blow(holder, x, y) {
    if (this.bs.length >= 24) { const o = this.bs.find(q => q.st === 'rise'); if (o) this.kill(o, true); }
    const b = this.mk(x, y, 3, 'inflate');
    b.v = sing(freq(this.r2d(3)), 'sine');
    this.bs.push(b); this.inf.set(holder, b);
  },
  letGo(holder) {
    const b = this.inf.get(holder); if (!b) return;
    this.inf.delete(holder);
    if (b.v) { b.v.stop(); b.v = null; }
    b.st = 'rise';
  },
  down(id, x, y) {
    for (let i = this.bs.length - 1; i >= 0; i--) {
      const b = this.bs[i];
      if (b.st === 'rise' && Math.hypot(b.x - x, b.y - y) <= b.r + 2) { this.popB(b); return; }
    }
    this.blow(id, x, y);
  },
  move(id, x, y) { const b = this.inf.get(id); if (b) { b.x = x; b.y = y; } },
  up(id) { this.letGo(id); },
  key(col, row, down) {
    const h = 'k' + col + ',' + row;
    if (down) this.blow(h, 14 + col / 9 * (W - 28), row > 0 ? 70 : row < 0 ? 138 : 110);
    else this.letGo(h);
  },
  update(dt) {
    if (!touched) { this.demo -= dt; if (this.demo <= 0) { this.demo = 1.3; this.bs.push(this.mk(R(16, W - 16), H - 16, R(4, 18), 'rise')); } }
    for (let i = this.bs.length - 1; i >= 0; i--) {
      const b = this.bs[i]; if (!b) continue;
      if (b.st === 'inflate') {
        b.r = Math.min(26, b.r + 13 * dt);
        if (b.v) b.v.setF(freq(this.r2d(b.r)));
        if (b.r >= 26) { this.popB(b); }
      } else {
        const vy = Math.max(14, 48 - b.r * 1.3);
        b.y -= vy * dt; b.x = clamp(b.x + Math.sin(T * 3 + b.ph) * 10 * dt, b.r, W - b.r);
        if (b.y <= b.r + 3) this.popB(b);
      }
    }
    outer: for (let i = 0; i < this.bs.length; i++) for (let j = i + 1; j < this.bs.length; j++) {
      const a = this.bs[i], b = this.bs[j];
      if (a.st !== 'rise' || b.st !== 'rise') continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r - 3) {
        a.r = Math.sqrt(a.r * a.r + b.r * b.r); a.x = (a.x + b.x) / 2; a.y = (a.y + b.y) / 2;
        this.kill(b, false); spark(a.x, a.y, a.c, 6);
        if (a.r >= 26) this.popB(a); else blorp(freq(this.r2d(a.r)));
        break outer;
      }
    }
  },
  draw() {
    for (const b of this.bs) {
      const r = Math.round(b.r + (b.st === 'inflate' ? Math.sin(T * 20) * .8 : 0));
      ctx.globalAlpha = .18;
      for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); rect(b.x - w, b.y + dy, 2 * w + 1, 1, b.c); }
      ctx.globalAlpha = 1;
      ring(b.x, b.y, r, b.c);
      rect(b.x - r * .55, b.y - r * .55, 2, 2, C.cream);
      if (r > 8) rect(b.x - r * .55 + 2, b.y - r * .55 + 2, 1, 1, C.cream);
    }
  }
};

/* ---------- glitch post effect ---------- */
let gTimer = 3;
function randomGlitch(dt) {
  gl = Math.max(0, gl - dt * 1.8);
  gTimer -= dt;
  if (gTimer <= 0) { gTimer = R(2, 6) / (.4 + base); if (Math.random() < .8) bump(R(.2, .7) * base + .05); }
}
function postFX() {
  const g = Math.min(1, gl + base * .12) * (RM ? .2 : 1);
  if (g < .05) return;
  const n = Math.floor(g * 8);
  for (let i = 0; i < n; i++) {
    const y = Math.floor(R(0, H)), h = Math.floor(R(2, 12)), dx = Math.round(R(-1, 1) * g * 16);
    ctx.drawImage(cv, 0, y, W, Math.min(h, H - y), dx, y, W, Math.min(h, H - y));
  }
  if (g > .55 && Math.random() < .5) {
    const bw = Math.floor(R(16, 60)), bh = Math.floor(R(6, 22)), sx = Math.floor(R(0, W - bw)), sy = Math.floor(R(0, H - bh));
    ctx.drawImage(cv, sx, sy, bw, bh, clamp(sx + Math.round(R(-12, 12)), 0, W - bw), clamp(sy + Math.round(R(-4, 4)), 0, H - bh), bw, bh);
  }
  if (g > .5) {
    const id = ctx.getImageData(0, 0, W, H), d = id.data, src = new Uint8ClampedArray(d), s = Math.floor(g * 4) + 1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      d[i] = src[(y * W + Math.max(0, x - s)) * 4];
      d[i + 2] = src[(y * W + Math.min(W - 1, x + s)) * 4 + 2];
    }
    ctx.putImageData(id, 0, 0);
  }
}

/* ---------- modes, input, ui ---------- */
const modes = [boing, squig, rip, choir, crabs, glim, blub];
let mode = null;
const tabsEl = $('#tabs'), hintEl = $('#hint');
modes.forEach((m, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.setAttribute('aria-selected', 'false');
  b.innerHTML = '<span class="k">' + (i + 1) + '</span><span>' + m.name + '</span>';
  b.addEventListener('click', () => { initAudio(); setMode(i); });
  tabsEl.appendChild(b);
});
function setMode(i) {
  releaseAll();
  if (mode && mode.leave) mode.leave();
  mode = modes[i]; if (mode.enter) mode.enter();
  [...tabsEl.children].forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
  hintEl.innerHTML = mode.hint;
  bump(.6);
}
const active = new Set(), keysDown = new Map();
function releaseAll() {
  if (!mode) return;
  for (const id of active) mode.up(id, 0, 0);
  active.clear();
  for (const [, v] of keysDown) mode.key(v.col, v.row, false);
  keysDown.clear();
}
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button > 0) return;
  initAudio(); touched = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  active.add(e.pointerId); const [x, y] = pos(e); mode.down(e.pointerId, x, y);
});
cv.addEventListener('pointermove', e => { if (!active.has(e.pointerId)) return; const [x, y] = pos(e); mode.move(e.pointerId, x, y); });
const endPtr = e => { if (!active.has(e.pointerId)) return; active.delete(e.pointerId); const [x, y] = pos(e); mode.up(e.pointerId, x, y); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());

const ROWS = [['qwertyuiop', 1], ['asdfghjkl;', 0], ['zxcvbnm,./', -1]];
function keyInfo(k) { for (const [s, r] of ROWS) { const c = s.indexOf(k); if (c >= 0) return { col: c, row: r }; } return null; }
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k >= '1' && k <= '7') { initAudio(); touched = true; setMode(+k - 1); e.preventDefault(); return; }
  if (k === 'ArrowUp' || k === 'ArrowDown') { initAudio(); cycleScale(k === 'ArrowUp' ? 1 : -1); e.preventDefault(); return; }
  if (k === 'Escape') { mode.reset(); bump(.8); return; }
  const info = keyInfo(k);
  if (!info) return;
  e.preventDefault();
  if (e.repeat || keysDown.has(k)) return;
  initAudio(); touched = true;
  keysDown.set(k, info); mode.key(info.col, info.row, true);
});
window.addEventListener('keyup', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const v = keysDown.get(k); if (!v) return;
  keysDown.delete(k); mode.key(v.col, v.row, false);
});
window.addEventListener('blur', releaseAll);

function cycleScale(d) {
  scaleI = (scaleI + d + SCALES.length) % SCALES.length;
  $('#scaleBtn').textContent = 'Scale: ' + SCALES[scaleI].n;
  for (let i = 0; i < 5; i++) tone(freq(i + 2), { type: 'square', dur: .09, vol: .12, delay: i * .06 });
  bump(.5);
}
$('#scaleBtn').addEventListener('click', () => { initAudio(); cycleScale(1); });
$('#glitch').addEventListener('input', e => { base = +e.target.value / 100; bump(.4); });
$('#muteBtn').addEventListener('click', e => {
  initAudio(); muted = !muted;
  if (master) master.gain.value = muted ? 0 : .55;
  e.target.textContent = 'Sound: ' + (muted ? 'off' : 'on');
});
$('#clearBtn').addEventListener('click', () => { mode.reset(); bump(.8); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  randomGlitch(dt);
  drawBG(dt);
  mode.update(dt);
  partsUpdate(dt);
  mode.draw();
  partsDraw();
  postFX();
  requestAnimationFrame(frame);
}
setMode(0);
requestAnimationFrame(frame);
})();
</script>

</body></html>
