<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffe3f1;
    --bg-dots: #ffd0e8;
    --ink: #4a2c5a;
    --card: #fff8fc;
    --pink: #ff9ecb;
    --mint: #a8f0d8;
    --lemon: #fff0a3;
    --sky: #a9d8ff;
    --lilac: #d6b9ff;
    --peach: #ffcba4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: 'Press Start 2P', monospace;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--bg-dots) 25%, transparent 25%, transparent 75%, var(--bg-dots) 75%),
      linear-gradient(45deg, var(--bg-dots) 25%, transparent 25%, transparent 75%, var(--bg-dots) 75%);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    image-rendering: pixelated;
  }
  header { text-align: center; margin: 12px 0 32px; }
  h1 {
    font-size: clamp(20px, 6vw, 40px);
    margin: 16px 0 12px;
    line-height: 1.3;
    color: #fff;
    text-shadow:
      4px 4px 0 var(--ink),
      -2px -2px 0 var(--ink), 2px -2px 0 var(--ink),
      -2px 2px 0 var(--ink);
  }
  .sub { font-size: 10px; line-height: 1.8; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--card);
    padding: 16px;
    /* pixel border via stacked box-shadows */
    box-shadow:
      0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
      -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
      8px 8px 0 0 rgba(74,44,90,.35);
    transition: transform .1s steps(2);
  }
  .card:hover, .card:focus-visible {
    transform: translate(-4px, -4px);
    outline: none;
    box-shadow:
      0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
      -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
      12px 12px 0 0 rgba(74,44,90,.35);
  }
  .card:active { transform: translate(2px, 2px); }
  .thumb {
    height: 96px;
    display: grid;
    place-items: center;
    margin-bottom: 14px;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.12), inset 4px 4px 0 rgba(255,255,255,.5);
  }
  .thumb svg { width: 64px; height: 64px; shape-rendering: crispEdges; image-rendering: pixelated; }
  .card h2 { font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
  .card p { font-size: 8px; line-height: 1.9; margin: 0 0 14px; }
  .play {
    display: inline-block;
    font-size: 9px;
    padding: 8px 10px;
    background: var(--ink);
    color: #fff;
  }
  .card:hover .play { background: #ff6fae; }

  footer { text-align: center; font-size: 8px; margin-top: 40px; line-height: 2; }
  .sprites { display: flex; justify-content: center; gap: 12px; }
  .sprites svg { width: 40px; height: 40px; shape-rendering: crispEdges; }
</style>
</head>
<body>

<header>
  <div class="sprites" id="header-sprites"></div>
  <h1>PIXEL ARCADE</h1>
  <div class="sub">PICK A GAME <span class="blink">▮</span></div>
</header>

<main class="grid" id="grid"></main>

<footer>
  <div class="sprites" id="footer-sprites"></div>
  <p>MADE BY CLAUDE WITH 1 PROMPT EACH</p>
</footer>

<script>
/* ============================================================
   ✏️  EDIT YOUR GAMES HERE
   Each game needs:
     name  – title shown on the card
     url   – link to the game
     desc  – short description
     color – one of: pink, mint, lemon, sky, lilac, peach
     icon  – one of: heart, star, ghost, mushroom, gem, cat
   To add a game, copy a line and change the values.
   To remove one, delete its line.
   ============================================================ */
const GAMES = [
  { name: "Glimmer Heaven",       url: "https://poked.us/glimmer.html",                           desc: "roguelike bullet heaven", color: "lemon", icon: "gem" },
  { name: "Vesper Void",     url: "https://poked.us/void.html", desc: "platformer with blackhole attack",       color: "mint",  icon: "star" },
  { name: "d*nah in wonderland", url: "https://poked.us/dinah.html",                            desc: "like q*bert",        color: "lilac", icon: "ghost" },
  { name: "Storm Warren",    url: "https://poked.us/storm.html",                               desc: "storms are scary for bunnies",     color: "pink",  icon: "heart" },
  { name: "Tubetop Beat",    url: "https://poked.us/beats.html",                            desc: "tempest-like mess",             color: "sky",   icon: "mushroom" },
  { name: "Burrow Bots", url: "https://poked.us/bun.html",                           desc: "pac-man roguelike with bunny",       color: "peach", icon: "cat" },
  { name: "Mochi Blocks",       url: "https://poked.us/mochiblocks.html",                           desc: "cute tetris with piano sounds", color: "lemon", icon: "gem" },
  { name: "Pet Rock Paperboy",     url: "https://poked.us/petrock.html", desc: "throw pet rocks!",       color: "mint",  icon: "star" },
];
/* ============================================================ */


/* Pixel sprites: each row is a string, "." = empty, letters = palette color */
const PALETTE = { o: "#4a2c5a", r: "#ff5f9e", p: "#ff9ecb", w: "#ffffff", y: "#ffd84d", g: "#58d6a4", b: "#6bb8ff", l: "#b88cff", n: "#ffb27a" };
const SPRITES = {
  heart: [
    "..oo..oo..",
    ".orroorro.",
    "orwrrrrrro",
    "orrrrrrrro",
    "orrrrrrrro",
    ".orrrrrro.",
    "..orrrro..",
    "...orro...",
    "....oo....",
  ],
  star: [
    "....oo....",
    "...oyyo...",
    "...oyyo...",
    "ooooyyoooo",
    "oyyyyyyyyo",
    ".oyywyyyo.",
    "..oyyyyo..",
    "..oyoyyo..",
    ".oyo..oyo.",
    ".oo....oo.",
  ],
  ghost: [
    "...oooo...",
    "..owwwwo..",
    ".owwwwwwo.",
    "owwoowwoow",
    "owwoowwoow",
    "owwwwwwwwo",
    "owwwppwwwo",
    "owwwwwwwwo",
    "owowwowwo.",
    ".o.oo.oo..",
  ],
  mushroom: [
    "...oooo...",
    "..orrwwro.",
    ".orrwwwrro",
    "orwwrrrwwo",
    "orwwrrrrro",
    "oooooooooo",
    "..owwwwo..",
    "..owowwo..",
    "..owwwwo..",
    "...oooo...",
  ],
  gem: [
    "..oooooo..",
    ".obbwbbbo.",
    "obbwbbbbbo",
    "oooooooooo",
    ".obbbbbbo.",
    "..obbbbo..",
    "...obbo...",
    "....oo....",
  ],
  cat: [
    "o.o....o.o",
    "ono....ono",
    "onnoooonno",
    "onnnnnnnno",
    "onoonnoono",
    "onnnnnnnno",
    "onnnppnnno",
    ".onnnnnno.",
    "..oooooo..",
  ],
};

function spriteSVG(name) {
  const rows = SPRITES[name] || SPRITES.star;
  const h = rows.length, w = rows[0].length;
  let rects = "";
  rows.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch !== ".") rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PALETTE[ch] || "#000"}"/>`;
    });
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${rects}</svg>`;
}

/* Build the cards */
const grid = document.getElementById("grid");
GAMES.forEach(g => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = g.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.innerHTML = `
    <div class="thumb" style="background: var(--${g.color})">${spriteSVG(g.icon)}</div>
    <h2></h2>
    <p></p>
    <span class="play">▶ PLAY</span>`;
  a.querySelector("h2").textContent = g.name;
  a.querySelector("p").textContent = g.desc;
  grid.appendChild(a);
});

/* Decorative sprites */
document.getElementById("header-sprites").innerHTML = ["heart", "star", "heart"].map(spriteSVG).join("");
document.getElementById("footer-sprites").innerHTML = ["ghost", "mushroom", "cat"].map(spriteSVG).join("");
</script>
</body>
</html>
